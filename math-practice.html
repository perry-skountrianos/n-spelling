<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Math Practice — CC6</title>
    <link rel="stylesheet" href="styles.css?v=10">
    <link rel="stylesheet" href="quizes.css?v=1">
    <style>
        .quiz-app-container { text-align: left !important; max-width: 760px; }
        .quiz-question { justify-content: flex-start !important; text-align: left !important; }
        .quiz-options  { align-items: stretch !important; }
        .gear-menu-wrapper { position: static !important; margin-left: auto; }

        /* ===== Daily practice timer ===== */
        .daily-timer-chip { display: none !important; }
        /* Donut ring styling tweaks specific to the timer donut */
        .donut-ring.is-paused { opacity: 0.45; }
        .donut-timer-label { font-variant-numeric: tabular-nums; font-weight: 500; }
        /* Single activity ring filled with green (correct) + red (wrong) */
        .activity-rings-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            line-height: 1.05;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            pointer-events: none;
        }
        .activity-rings-label .ar-count { display: block; }
        .activity-rings-label .ar-remaining { color: #222; font-size: 20px; }
        .activity-rings-label .ar-correct,
        .activity-rings-label .ar-wrong { display: none !important; }
        .activity-rings .donut-ring { cursor: help; }
        @media (max-width: 480px) {
            .activity-rings-label .ar-remaining { font-size: 16px; }
        }
        /* Tighten the score-row layout on small screens so 4 donuts + 2 circles fit */
        @media (max-width: 480px) {
            .score-display { gap: 4px !important; }
            .score-display .donut-wrapper,
            .score-display .profile-circle,
            .score-display .home-circle { width: 46px !important; height: 46px !important; }
            .score-display .donut-label { font-size: 12px !important; }
            .score-display .profile-circle-avatar { font-size: 20px !important; }
            .score-display .home-circle svg { width: 24px; height: 24px; }
        }
        .daily-goal-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .daily-goal-row label {
            font-size: 14px; color: #333; font-weight: 500;
        }
        .daily-goal-row input[type="number"] {
            width: 64px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 14px; text-align: center;
        }
        .daily-goal-banner {
            position: fixed; left: 50%; top: 18px;
            transform: translateX(-50%) translateY(-160%);
            background: linear-gradient(135deg, #d1f7d6 0%, #b9f0c2 100%);
            border: 1px solid #6cc878;
            color: #1a5d27;
            padding: 12px 22px; border-radius: 999px;
            font-weight: 700; font-size: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            z-index: 2000; opacity: 0;
            transition: transform 0.5s cubic-bezier(.2,.7,.2,1), opacity 0.4s;
        }
        .daily-goal-banner.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .daily-history-wrap {
            margin: 8px 0 18px;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #e3e6ea;
            border-radius: 12px;
        }
        .daily-history-title {
            font-size: 13px; font-weight: 600; color: #555;
            margin-bottom: 8px; display: flex; align-items: center;
            justify-content: space-between;
        }
        .daily-history-title .dh-total { font-weight: 500; color: #777; font-size: 12px; }
        .daily-history-grid {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 4px;
        }
        .daily-history-cell {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 4px;
            background: #e8ecef;
            font-size: 9px;
            color: #fff;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 2px;
        }
        .daily-history-cell.has-progress { color: #fff; font-weight: 600; }
        .daily-history-cell.is-today { outline: 2px solid #0071e3; outline-offset: 1px; }
        .daily-history-cell .dh-date {
            position: absolute; top: 2px; left: 0; right: 0;
            text-align: center; font-size: 9px; color: rgba(0,0,0,0.45);
        }
        .daily-history-cell.has-progress .dh-date { color: rgba(255,255,255,0.85); }

        /* Desktop: align gear menu to the far right */
        @media (min-width: 768px) {
            .score-display {
                width: calc(100% - 40px);
            }
        }

        .topic-pill {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: #0071e3;
            background: #e3f2fd;
            border-radius: 999px;
            padding: 3px 10px;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }
        button.topic-pill-btn {
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        button.topic-pill-btn::after {
            content: ' \203A';
            font-weight: 700;
            opacity: 0.7;
        }
        button.topic-pill-btn:hover {
            background: #bbdefb;
        }
        button.topic-pill-btn:active {
            transform: scale(0.97);
        }
        .progress-counter {
            font-size: 13px;
            color: #888;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .quiz-numeric-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            font-family: inherit;
            background: #fafafa;
            outline: none;
            transition: border-color 0.15s;
        }
        .quiz-numeric-input:focus { border-color: #90caf9; }
        .quiz-numeric-input.quiz-correct { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }
        .quiz-numeric-input.quiz-wrong   { border-color: #e53935; background: #ffebee; color: #c62828; }
        .quiz-submit-btn {
            margin-top: 10px;
            padding: 12px 24px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }
        .quiz-submit-btn:hover:not(:disabled) { background: #0077ed; }
        .quiz-submit-btn:disabled { background: #c7c7cc; cursor: default; }

        .quiz-multi-hint {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            font-style: italic;
        }
        .quiz-multi-option-wrapper {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            margin: 8px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .quiz-multi-option-wrapper:hover {
            border-color: #0071e3;
            background: #f5f9ff;
        }
        .quiz-multi-option-wrapper.selected {
            border-color: #0071e3;
            background: #e3f2fd;
        }
        .quiz-multi-checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #0071e3;
        }
        .quiz-multi-option-label {
            flex: 1;
            cursor: pointer;
            font-size: 15px;
            color: #333;
        }
        .quiz-multi-option-wrapper.correct .quiz-multi-checkbox {
            accent-color: #4caf50;
        }
        .quiz-multi-option-wrapper.wrong .quiz-multi-checkbox {
            accent-color: #e53935;
        }
        .quiz-option.quiz-correct-missed {
            border-color: #ffa000;
            background: #fff8e1;
            color: #e65100;
        }
        .quiz-explanation {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: #fffbe6;
            border-left: 4px solid #ffc107;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.5;
            color: #333;
        }
        .quiz-explanation.wrong {
            background: #ffebee;
            border-left-color: #e53935;
            padding: 16px 18px;
            font-size: 16px;
        }
        .quiz-explanation .exp-title {
            display: block;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            color: #c62828;
        }
        .quiz-explanation.correct .exp-title { color: #2e7d32; }
        .quiz-explanation .exp-correct-answer {
            display: block;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .equation-snap {
            margin: 12px 0;
            padding: 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f2fbf5 0%, #eef7ff 100%);
            border: 1px solid #d7eadf;
            overflow: hidden;
        }
        .equation-snap-label {
            display: block;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #2e7d32;
        }
        .equation-snap-track {
            display: grid;
            gap: 8px;
        }
        .equation-snap-step {
            opacity: 0;
            transform: translateY(10px) scale(0.98);
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(46, 125, 50, 0.12);
            font-size: 22px;
            line-height: 1.2;
            font-weight: 700;
            color: #1f2937;
            text-align: center;
            animation: equationSnapIn 0.42s ease forwards;
            animation-delay: calc(var(--step-index) * 0.45s);
        }
        .equation-snap-step.is-final {
            color: #0f7a34;
            background: rgba(232, 245, 233, 0.98);
            border-color: rgba(76, 175, 80, 0.35);
        }
        @keyframes equationSnapIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .quiz-explanation .exp-steps {
            margin: 0;
            padding-left: 20px;
        }
        .quiz-explanation .exp-steps li { margin-bottom: 4px; }
        .live-missed-wrap {
            margin-top: 12px;
        }
        .live-missed-wrap details {
            text-align: left;
        }
        .explanation-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }
        .explanation-actions .speak-btn {
            margin-top: 0;
        }
        .explain-next-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 999px;
            background: #0071e3;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,113,227,0.25);
            transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
            flex-shrink: 0;
        }
        .explain-next-btn:hover {
            background: #0077ed;
            box-shadow: 0 3px 10px rgba(0,113,227,0.35);
        }
        .explain-next-btn:active { transform: translateY(1px); }
        .explain-next-btn svg { display: block; }
        .quiz-result {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            padding: 30px 20px;
            color: #2e7d32;
        }
        .quiz-result .restart-btn {
            display: block;
            margin: 20px auto 0;
            padding: 12px 28px;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        /* ----- Mini-lesson card ----- */
        .lesson-card {
            background: #fafbfc;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 14px;
            font-size: 15.5px;
            line-height: 1.55;
            color: #1d1d1f;
        }
        .lesson-card h3 {
            font-size: 16px;
            font-weight: 700;
            color: #0071e3;
            margin: 12px 0 6px;
        }
        .lesson-card h3:first-child { margin-top: 0; }
        .lesson-card p, .lesson-card ul, .lesson-card ol, .lesson-card table, .lesson-card pre { margin: 6px 0; }
        .lesson-card ul, .lesson-card ol { padding-left: 22px; }
        .lesson-card li { margin: 3px 0; }
        .lesson-card code {
            background: #f0f3f7;
            padding: 1px 5px;
            border-radius: 4px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.95em;
        }
        .lesson-card pre {
            background: #f0f3f7;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        .lesson-card table th, .lesson-card table td {
            border-bottom: 1px solid #e8e8ec;
        }
        .lesson-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .topic-header-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .topic-header-row .lesson-actions { margin-bottom: 0; justify-content: flex-start; display: inline-flex; }
        .topic-header-row .topic-pill { margin-bottom: 0; }
        .lesson-toggle {
            background: none;
            border: 1px solid #d2d2d7;
            color: #555;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
        }
        .lesson-toggle:hover { border-color: #0071e3; color: #0071e3; }
        .lesson-video-wrap {
            margin: 14px 0 18px;
            padding: 14px;
            background: linear-gradient(135deg, #fff5f8 0%, #fff9ef 100%);
            border: 1px solid #ffd6e0;
            border-radius: 14px;
        }
        .lesson-video-title {
            font-weight: 600;
            font-size: 15px;
            color: #d6336c;
            margin-bottom: 4px;
        }
        .lesson-video-blurb {
            font-size: 13px;
            color: #6b6b73;
            margin-bottom: 10px;
        }
        .lesson-video-frame {
            position: relative;
            width: 100%;
            /* 16:9 video + space reserved for our top/bottom overlay strips so
               the actual video content is never cut off. */
            padding-top: calc(56.25% + 116px);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 14px rgba(214, 51, 108, 0.15);
        }
        /* Place the iframe inside the 16:9 "safe zone" between the top cover
           (60px) and the bottom controls (56px) so the actual video content
           is never hidden by our overlay strips. */
        .lesson-video-frame iframe {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 116px);
            border: 0;
        }
        .lesson-video-shield {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.78);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .lesson-video-shield[hidden] { display: none; }
        .lesson-video-resume {
            background: #ff2d55;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,45,85,0.4);
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .lesson-video-resume:hover {
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 8px 24px rgba(255,45,85,0.5);
        }
        /* Permanent cover for YouTube's top-bar chrome (share / "More videos" /
           YouTube logo). YouTube's own playback controls live at the BOTTOM of
           the player, so this strip only hides the off-site links. */
        .lesson-video-topcover {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            z-index: 4;
            pointer-events: auto;
            display: flex;
            align-items: center;
            padding: 0 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .lesson-video-topcover::before {
            content: '🎬 Lesson video';
            opacity: 0.9;
        }
        /* In fullscreen, lift the cover above the iframe layer */
        .lesson-video-frame:fullscreen .lesson-video-topcover,
        .lesson-video-frame:-webkit-full-screen .lesson-video-topcover { z-index: 2147483647; }
        /* In native fullscreen the frame is sized to the viewport directly,
           so undo the aspect-ratio padding hack. */
        .lesson-video-frame:fullscreen,
        .lesson-video-frame:-webkit-full-screen { padding-top: 0; width: 100vw; height: 100vh; background: #000; }
        .lesson-video-frame:fullscreen iframe,
        .lesson-video-frame:-webkit-full-screen iframe,
        .lesson-video-frame:fullscreen .lesson-video-clickcatch,
        .lesson-video-frame:-webkit-full-screen .lesson-video-clickcatch {
            top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%;
        }
        /* Pseudo-fullscreen fallback for browsers (notably iOS Safari) that
           refuse to put a non-<video> element into the Fullscreen API. */
        .lesson-video-frame.is-pseudo-fs {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* honor mobile browser UI when present */
            padding-top: 0;
            border-radius: 0;
            z-index: 2147483647;
            background: #000;
        }
        /* In pseudo-fullscreen, let the iframe and click-catch fill the whole
           viewport so the video itself \u2014 not just the wrapper \u2014 grows. The
           top cover and bottom controls stay floating above it. */
        .lesson-video-frame.is-pseudo-fs iframe,
        .lesson-video-frame.is-pseudo-fs .lesson-video-clickcatch {
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }
        body.lesson-video-pseudo-fs { overflow: hidden; }
        /* Transparent click-catch overlay above the iframe — swallows hover so
           YouTube's hover chrome (share / "More videos" / YT logo on the
           bottom) never appears. Click toggles play/pause via our API. */
        .lesson-video-clickcatch {
            position: absolute;
            top: 60px;   /* below topcover */
            left: 0;
            right: 0;
            bottom: 56px; /* above our custom controls */
            z-index: 3;
            cursor: pointer;
            background: transparent;
        }
        /* Custom bottom controls — replaces YouTube's native control bar. */
        .lesson-video-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 56px;
            background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.78));
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            z-index: 4;
            color: #fff;
            font-size: 13px;
        }
        .lvc-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;

        .lvc-progress {

            font-weight: 600;

        /* ----- TTS speaker buttons ----- */
        .speak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: none;

        .hint-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: none;
            border: 2px solid #f39c12;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            padding: 0;
            font-size: 18px;
            font-weight: 600;
            color: #f39c12;
        }
        .hint-btn:hover { border-color: #e67e22; color: #e67e22; background: #fff8f0; }
        .hint-btn:disabled { opacity: 0.3; cursor: default; }
        .hint-display {
            display: none;
            margin: 12px 0;
            padding: 12px 14px;
            background: #fffbf0;
            border-left: 4px solid #f39c12;
            border-radius: 6px;
            color: #b8860b;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
        }
        .hint-display.show { display: block; }
        .question-row {
            display: flex;

    <script>
    (async function(){
        // Wait for the question bank JSON to land before doing anything else.
        try { await window.__mathQuestionsReady; } catch(_) {}
        // -------- profile bootstrap --------
        if (typeof Profiles !== 'undefined' && !Profiles.requireProfile()) return;
        const currentProfile = (typeof Profiles !== 'undefined') ? Profiles.getCurrentId() : 'default';
        function profileRef(path) { return path + '/' + currentProfile; }
        function profileKey(k) { return currentProfile + '_' + k; }
        function emojiToImg(emoji, size) {
            const cp = [...emoji].map(c => c.codePointAt(0).toString(16)).join('-');
            const px = size || 36;
            return '<img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/' + cp + '.svg" alt="' + emoji + '" width="' + px + '" height="' + px + '" style="display:block;" draggable="false">';
        }

        // ============= Daily practice timer =============
        // Tracks active practice seconds per day, configurable goal, multi-device sync.
        // "Active" = page is the visible tab AND a question was answered in the last 60s.
        //
        // Multi-device model: each device writes ONLY its own contribution under its
        // device id. The day total = sum of all device subkeys. So 5 min on phone +
        // 10 min on laptop = 15 min total visible everywhere.
        //
        // Storage:
        //   localStorage[`deviceId`]                            → stable per-browser id
        //   localStorage[`dailyGoal_<profile>`]                 → minutes (number)
        //   localStorage[`dailyTime_<profile>`]                 → { YMD: own seconds }
        //   Firebase  mathDailyGoal/<profile>                   → minutes (number)
        //   Firebase  mathDailyTime/<profile>/<YMD>/<deviceId>  → seconds (number)
        //   Firebase  mathDailyTime/<profile>/<YMD>/legacy      → pre-migration value
        const DailyTime = (function() {
            const GOAL_KEY = 'dailyGoal_' + currentProfile;
            const TIME_KEY = 'dailyTime_' + currentProfile;
            const DEVICE_KEY = 'deviceId';
            const ACTIVE_WINDOW_MS = 10 * 1000;       // 10s since last activity
            const MAX_TICK_MS = 5 * 1000;             // ignore tick gaps > 5s (clock fiddle / sleep)
            const FIREBASE_FLUSH_MS = 10 * 1000;      // push to RTDB at most every 10s
            const DEFAULT_GOAL_MIN = 20;

            function getDeviceId() {
                try {
                    let id = localStorage.getItem(DEVICE_KEY);
                    if (!id) {
                        id = 'd_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
                        localStorage.setItem(DEVICE_KEY, id);
                    }
                    return id;
                } catch(_) {
                    return 'd_anon_' + Math.random().toString(36).slice(2, 10);
                }
            }
            const deviceId = getDeviceId();

            const state = {
                goalMin: DEFAULT_GOAL_MIN,
                today: ymd(new Date()),
                ownDays: {},        // YMD -> seconds THIS device contributed
                otherDays: {},      // YMD -> seconds from OTHER devices (incl. legacy)
                lastActivity: 0,    // ms epoch of last answered question
                lastTickAt: 0,      // ms epoch of last successful tick (for delta)
                celebratedToday: false,
                dirtyTodaySec: 0,   // seconds not yet pushed to firebase
                lastFirebaseFlushAt: 0,
                lastSyncAt: 0,      // ms epoch of last successful RTDB write
                lastSyncError: null,// string of last error, null on success
                tickerId: null
            };

            function ymd(d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + dd;
            }
            function fmtMMSS(sec) {
                sec = Math.max(0, Math.floor(sec));
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return m + ':' + String(s).padStart(2, '0');
            }
            function ownSec(ymdKey) { return Number(state.ownDays[ymdKey]) || 0; }
            function otherSec(ymdKey) { return Number(state.otherDays[ymdKey]) || 0; }
            function dayTotal(ymdKey) { return ownSec(ymdKey) + otherSec(ymdKey); }
            function todaySec() { return dayTotal(state.today); }
            function goalSec() { return Math.max(60, state.goalMin * 60); }

            function loadLocal() {
                try {
                    const g = parseInt(localStorage.getItem(GOAL_KEY), 10);
                    if (g >= 1 && g <= 120) state.goalMin = g;
                } catch(_) {}
                try {
                    const t = JSON.parse(localStorage.getItem(TIME_KEY) || '{}');
                    if (t && typeof t === 'object') {
                        // Backward-compat: old shape was { YMD: totalSeconds }. We now treat
                        // this as this device's own contribution (since prior data was written
                        // by this device under the old single-key model).
                        state.ownDays = t;
                    }
                } catch(_) {}
                if (todaySec() >= goalSec()) state.celebratedToday = true;
            }
            function saveLocal() {
                try { localStorage.setItem(GOAL_KEY, String(state.goalMin)); } catch(_) {}
                try { localStorage.setItem(TIME_KEY, JSON.stringify(state.ownDays)); } catch(_) {}
            }
            async function loadRemoteAndMerge() {
                if (typeof db === 'undefined') return;
                try {
                    const [gSnap, tSnap] = await Promise.all([
                        db.ref('mathDailyGoal/' + currentProfile).once('value'),
                        db.ref('mathDailyTime/' + currentProfile).once('value')
                    ]);
                    const remoteGoal = gSnap.val();
                    if (typeof remoteGoal === 'number' && remoteGoal >= 1 && remoteGoal <= 120) {
                        state.goalMin = remoteGoal;
                    }
                    const remoteDays = tSnap.val() || {};
                    const newOther = {};
                    const pendingMigrations = [];
                    Object.keys(remoteDays).forEach(ymdKey => {
                        const v = remoteDays[ymdKey];
                        if (typeof v === 'number') {
                            // Legacy single-number per day. Treat as "other" contribution
                            // and migrate to a `legacy` subkey so child writes don't destroy it.
                            newOther[ymdKey] = v;
                            pendingMigrations.push({ ymd: ymdKey, value: v });
                        } else if (v && typeof v === 'object') {
                            let othersSum = 0;
                            let ownRemote = 0;
                            Object.keys(v).forEach(devKey => {
                                const sec = Number(v[devKey]) || 0;
                                if (devKey === deviceId) ownRemote = sec;
                                else othersSum += sec;
                            });
                            newOther[ymdKey] = othersSum;
                            // Reconcile own: take max(local, remote) in case localStorage was wiped
                            const localOwn = ownSec(ymdKey);
                            if (ownRemote > localOwn) state.ownDays[ymdKey] = ownRemote;
                        }
                    });
                    state.otherDays = newOther;
                    // Best-effort migrate legacy numeric days into a `legacy` subkey.
                    pendingMigrations.forEach(m => {
                        db.ref('mathDailyTime/' + currentProfile + '/' + m.ymd + '/legacy')
                          .set(m.value).catch(()=>{});
                    });
                    state.dirtyTodaySec = 0;
                    saveLocal();
                    if (todaySec() >= goalSec()) state.celebratedToday = true;
                    updateChip();
                } catch(e) {
                    console.warn('DailyTime remote load failed:', e);
                }
            }
            async function flushRemote(force) {
                if (typeof db === 'undefined') {
                    state.lastSyncError = 'Firebase not loaded';
                    updateChip();
                    return;
                }
                const now = Date.now();
                if (!force && (now - state.lastFirebaseFlushAt) < FIREBASE_FLUSH_MS) return;
                if (state.dirtyTodaySec <= 0 && !force) return;
                state.lastFirebaseFlushAt = now;
                try {
                    // Write only THIS device's contribution under its own subkey.
                    await db.ref('mathDailyTime/' + currentProfile + '/' + state.today + '/' + deviceId)
                            .set(ownSec(state.today));
                    state.dirtyTodaySec = 0;
                    state.lastSyncAt = Date.now();
                    state.lastSyncError = null;
                    updateChip();
                } catch(e) {
                    state.lastSyncError = (e && e.message) ? e.message : 'unknown error';
                    console.warn('DailyTime remote flush failed:', e);
                    updateChip();
                }
            }
            async function pushGoalRemote() {
                if (typeof db === 'undefined') return;
                try { await db.ref('mathDailyGoal/' + currentProfile).set(state.goalMin); } catch(_) {}
            }

            function maybeRollover() {
                const t = ymd(new Date());
                if (t !== state.today) {
                    // Flush yesterday before switching
                    flushRemote(true);
                    state.today = t;
                    state.celebratedToday = (todaySec() >= goalSec());
                    state.dirtyTodaySec = 0;
                }
            }

            // Record that the kid did something (answered, typed, clicked, moved pointer).
            // Marks the timer as actively counting for the next ACTIVE_WINDOW_MS.
            function recordActivity() {
                state.lastActivity = Date.now();
                updateChip();
            }

            // While a practice session is active, treat ANY user input on the page as
            // activity (so the timer keeps counting while the kid is thinking and typing,
            // not only at the exact moment they submit). Idempotent attach/detach.
            let _inputAttached = false;
            let _lastInputAt = 0;
            function _onInput() {
                const now = Date.now();
                if (now - _lastInputAt < 500) return; // throttle to 2Hz
                _lastInputAt = now;
                recordActivity();
            }
            function attachInputListeners() {
                if (_inputAttached) return;
                document.addEventListener('keydown', _onInput, true);
                document.addEventListener('pointerdown', _onInput, true);
                document.addEventListener('pointermove', _onInput, true);
                document.addEventListener('wheel', _onInput, true);
                document.addEventListener('touchstart', _onInput, true);
                _inputAttached = true;
            }
            function detachInputListeners() {
                if (!_inputAttached) return;
                document.removeEventListener('keydown', _onInput, true);
                document.removeEventListener('pointerdown', _onInput, true);
                document.removeEventListener('pointermove', _onInput, true);
                document.removeEventListener('wheel', _onInput, true);
                document.removeEventListener('touchstart', _onInput, true);
                _inputAttached = false;
            }
            function beginSession() {
                recordActivity();
                attachInputListeners();
            }
            function endSession() {
                detachInputListeners();
                flushRemote(true);
            }

            function isCounting() {
                if (typeof document !== 'undefined' && document.visibilityState !== 'visible') return false;
                if (!state.lastActivity) return false;
                return (Date.now() - state.lastActivity) < ACTIVE_WINDOW_MS;
            }

            function tick() {
                maybeRollover();
                const now = Date.now();
                if (state.lastTickAt && isCounting()) {
                    const delta = now - state.lastTickAt;
                    if (delta > 0 && delta <= MAX_TICK_MS) {
                        const addSec = delta / 1000;
                        state.ownDays[state.today] = ownSec(state.today) + addSec;
                        state.dirtyTodaySec += addSec;
                        // Crossing the goal: celebrate once per day
                        if (!state.celebratedToday && todaySec() >= goalSec()) {
                            state.celebratedToday = true;
                            showGoalBanner();
                        }
                        // Flush local every tick (cheap); throttle remote
                        saveLocal();
                        flushRemote(false);
                    }
                }
                state.lastTickAt = now;
                updateChip();
            }

            function updateChip() {
                const cur = todaySec();
                const goal = goalSec();
                const remaining = Math.max(0, goal - cur);
                const done = cur >= goal;
                const counting = isCounting();
                const mainText = done
                    ? '✓ Done for today! (' + fmtMMSS(cur) + ')'
                    : '⏱ ' + fmtMMSS(remaining) + ' left today';
                const chip = document.getElementById('dailyTimerChip');
                const txt = document.getElementById('dailyTimerText');
                if (chip && txt) {
                    txt.textContent = mainText;
                    chip.classList.toggle('is-paused', !counting && !done);
                    chip.classList.toggle('is-done', done);
                }
                // Score-bar donut for the timer
                const donut = document.getElementById('donutTimer');
                const donutLabel = document.getElementById('donutTimerLabel');
                if (donut && donutLabel) {
                    const pct = Math.max(0, Math.min(100, (cur / goal) * 100));
                    donut.setAttribute('stroke-dasharray', pct.toFixed(1) + ' ' + (100 - pct).toFixed(1));
                    donut.setAttribute('stroke', done ? '#4caf50' : '#ff9800');
                    donut.classList.toggle('is-paused', !counting && !done);
                    const clockSvg = donut.closest('svg');
                    if (clockSvg) {
                        const bg = clockSvg.querySelector('.donut-bg');
                        const ticks = clockSvg.querySelector('.donut-ticks');
                        if (bg) bg.setAttribute('stroke', done ? '#c8e6c9' : '#e0e0e0');
                        if (ticks) ticks.setAttribute('stroke', done ? '#66bb6a' : '#bdbdbd');
                    }
                    // Label: minutes remaining (or seconds when <1 min), checkmark when done
                    if (done) {
                        donutLabel.textContent = '✓';
                        donutLabel.style.color = '#2e7d32';
                    } else if (remaining >= 60) {
                        donutLabel.textContent = Math.ceil(remaining / 60) + 'm';
                        donutLabel.style.color = '';
                    } else {
                        donutLabel.textContent = Math.ceil(remaining) + 's';
                        donutLabel.style.color = '#e67e22';
                    }
                }
                const menuTxt = document.getElementById('dailyTimerMenuText');
                const menuStatus = document.getElementById('dailyTimerMenuStatus');
                if (menuTxt) menuTxt.textContent = mainText;
                if (menuStatus) {
                    if (done) { menuStatus.textContent = ''; }
                    else if (counting) { menuStatus.textContent = '● counting'; menuStatus.style.color = '#2ea043'; }
                    else { menuStatus.textContent = 'paused'; menuStatus.style.color = '#999'; }
                }
            }

            function showGoalBanner() {
                const banner = document.getElementById('dailyGoalBanner');
                if (!banner) return;
                banner.classList.add('show');
                setTimeout(() => banner.classList.remove('show'), 6000);
            }

            function setGoalMinutes(m) {
                m = Math.max(1, Math.min(120, Math.floor(Number(m) || DEFAULT_GOAL_MIN)));
                state.goalMin = m;
                state.celebratedToday = (todaySec() >= goalSec());
                saveLocal();
                pushGoalRemote();
                updateChip();
            }

            function getHistory(days) {
                const out = [];
                const now = new Date();
                for (let i = days - 1; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(now.getDate() - i);
                    const k = ymd(d);
                    out.push({ ymd: k, date: d, seconds: dayTotal(k) });
                }
                return out;
            }

            function init() {
                loadLocal();
                updateChip();
                // Async remote merge (non-blocking)
                loadRemoteAndMerge();
                // Master tick every second
                state.lastTickAt = Date.now();
                state.tickerId = setInterval(tick, 1000);
                // Visibility change → force a flush + reset tick baseline so we don't credit
                // background time.
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        state.lastTickAt = Date.now();
                        // Pull any newer data from other devices
                        loadRemoteAndMerge();
                    } else {
                        flushRemote(true);
                    }
                });
                // Best-effort flush on page hide/unload
                window.addEventListener('pagehide', () => flushRemote(true));
                window.addEventListener('beforeunload', () => {
                    flushRemote(true);
                });
            }

            return {
                init,
                recordActivity,
                beginSession,
                endSession,
                setGoalMinutes,
                getGoalMinutes: () => state.goalMin,
                getTodaySeconds: () => todaySec(),
                getGoalSeconds: goalSec,
                getHistory,
                getSyncStatus: () => ({
                    lastSyncAt: state.lastSyncAt,
                    lastSyncError: state.lastSyncError,
                    dirtyTodaySec: state.dirtyTodaySec,
                    deviceId,
                    ownTodaySec: ownSec(state.today),
                    otherTodaySec: otherSec(state.today),
                    hasDb: (typeof db !== 'undefined')
                }),
                resetToday: () => {
                    const today = state.today;
                    state.ownDays[today] = 0;
                    state.otherDays[today] = 0;
                    state.dirtyTodaySec = 0;
                    state.celebratedToday = false;
                    saveLocal();
                    updateChip();
                    if (typeof db !== 'undefined' && currentProfile) {
                        return db.ref('mathDailyTime/' + currentProfile + '/' + today).remove()
                            .catch(e => console.warn('resetToday remote failed:', e));
                    }
                    return Promise.resolve();
                },
                flushNow: () => flushRemote(true)
            };
        })();
        DailyTime.init();

        // -------- helpers --------
        function shuffle(arr){
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ===================== TTS =====================
        const synth = window.speechSynthesis;
        let ttsVoice = null;
        function pickVoice(){
            const voices = synth.getVoices();
            if (!voices.length) return null;
            const en = voices.filter(v => v.lang && v.lang.startsWith('en'));
            const preferred = ['Google UK English Female','Samantha','Karen','Moira','Martha','Kate','Serena','Fiona'];
            for (const name of preferred) {
                const v = en.find(v => v.name.includes(name));
                if (v) return v;
            }
            return en[0] || voices[0];
        }
        synth.getVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => { ttsVoice = pickVoice(); };
        ttsVoice = pickVoice();

        function ttsCancel(){
            try { synth.cancel(); } catch(_){}
            if (window.cloudTTS) try { cloudTTS.stop(); } catch(_){}
            document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
        }
        function ttsSpeakBrowser(text, onend){
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 1; u.lang = 'en-GB';
            if (!ttsVoice) ttsVoice = pickVoice();
            if (ttsVoice) u.voice = ttsVoice;
            if (onend) u.onend = onend;
            synth.speak(u);
        }
        function ttsSpeak(text, onend){
            ttsCancel();
            if (!text) { if (onend) onend(); return; }
            if (window.cloudTTS && cloudTTS.enabled && cloudTTS.enabled()) {
                cloudTTS.speak(text, () => { if (onend) onend(); }).then(ok => {
                    if (!ok) ttsSpeakBrowser(text, onend);
                });
            } else {
                ttsSpeakBrowser(text, onend);
            }
        }
        function htmlToReadable(html){
            const div = document.createElement('div');
            div.innerHTML = html;
            // Replace some math symbols with spoken words
            let text = div.textContent || div.innerText || '';
            text = text.replace(/×/g, ' times ')
                       .replace(/÷/g, ' divided by ')
                       .replace(/≤/g, ' less than or equal to ')
                       .replace(/≥/g, ' greater than or equal to ')
                       .replace(/</g, ' less than ')
                       .replace(/>/g, ' greater than ')
                       .replace(/²/g, ' squared')
                       .replace(/³/g, ' cubed')
                       .replace(/\s+/g, ' ')
                       .trim();
            return text;
        }

        // YouTube IFrame API — load once on demand, then cover the player with our
        // own overlay whenever the video is paused/ended/cued. This hides the
        // "share / more videos / YouTube logo" end-screen cards so kids can't
        // wander off into YouTube.
        let _ytApiReadyPromise = null;
        function loadYouTubeApi() {
            if (_ytApiReadyPromise) return _ytApiReadyPromise;
            _ytApiReadyPromise = new Promise(resolve => {
                if (window.YT && window.YT.Player) { resolve(window.YT); return; }
                const prev = window.onYouTubeIframeAPIReady;
                window.onYouTubeIframeAPIReady = function () {
                    if (typeof prev === 'function') { try { prev(); } catch (e) {} }
                    resolve(window.YT);
                };
                if (!document.querySelector('script[data-yt-api]')) {
                    const s = document.createElement('script');
                    s.src = 'https://www.youtube.com/iframe_api';
                    s.dataset.ytApi = '1';
                    document.head.appendChild(s);
                }
            });
            return _ytApiReadyPromise;
        }
        function attachYouTubeShield(frameId) {
            const shield = document.getElementById(frameId + '_shield');
            const resumeBtn = document.getElementById(frameId + '_resume');
            const clickCatch = document.getElementById(frameId + '_click');
            const playPauseBtn = document.getElementById(frameId + '_playpause');
            const timeEl = document.getElementById(frameId + '_time');
            const progressEl = document.getElementById(frameId + '_progress');
            const progressFill = document.getElementById(frameId + '_progressfill');
            const fsBtn = document.getElementById(frameId + '_fs');
            if (!shield || !resumeBtn) return;
            const frameWrap = shield.parentElement; // .lesson-video-frame
            const fmt = sec => {
                sec = Math.max(0, Math.floor(sec || 0));
                const m = Math.floor(sec / 60), s = sec % 60;
                return `${m}:${s.toString().padStart(2,'0')}`;
            };
            // Buffer click while API is still loading
            let pendingPlay = false;
            resumeBtn.onclick = () => {
                shield.hidden = true;
                resumeBtn.textContent = '▶ Resume video';
                pendingPlay = true;
            };
            loadYouTubeApi().then(YT => {
                let isPlaying = false;
                let progressTimer = null;
                const player = new YT.Player(frameId, {
                    events: {
                        onReady: () => {
                            if (pendingPlay) { try { player.playVideo(); } catch (e) {} }
                        },
                        onStateChange: ev => {
                            // 1 = playing, 3 = buffering → safe to hide shield
                            // 0 = ended, 2 = paused, 5 = cued → show shield to block end-cards
                            if (ev.data === YT.PlayerState.PLAYING || ev.data === YT.PlayerState.BUFFERING) {
                                shield.hidden = true;
                                isPlaying = true;
                                if (playPauseBtn) playPauseBtn.textContent = '⏸';
                            } else {
                                shield.hidden = false;
                                isPlaying = false;
                                if (playPauseBtn) playPauseBtn.textContent = '▶';
                                resumeBtn.textContent = '▶ Resume video';
                            }
                        }
                    }
                });
                resumeBtn.onclick = () => {
                    shield.hidden = true;
                    resumeBtn.textContent = '▶ Resume video';
                    try { player.playVideo(); } catch (e) {}
                };
                const togglePlay = () => {
                    try { isPlaying ? player.pauseVideo() : player.playVideo(); } catch (e) {}
                };
                if (clickCatch) clickCatch.onclick = togglePlay;
                if (playPauseBtn) playPauseBtn.onclick = togglePlay;
                if (progressEl) {
                    progressEl.onclick = e => {
                        const rect = progressEl.getBoundingClientRect();
                        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                        try {
                            const dur = player.getDuration() || 0;
                            player.seekTo(pct * dur, true);
                        } catch (err) {}
                    };
                }
                if (fsBtn && frameWrap) {
                    const isPseudoFs = () => frameWrap.classList.contains('is-pseudo-fs');
                    const inNativeFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
                    const enterPseudoFs = () => {
                        frameWrap.classList.add('is-pseudo-fs');
                        document.body.classList.add('lesson-video-pseudo-fs');
                        // Try to lock landscape on phones — best effort, ignore failures.
                        try {
                            if (screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('landscape').catch(() => {});
                            }
                        } catch (e) {}
                    };
                    const exitPseudoFs = () => {
                        frameWrap.classList.remove('is-pseudo-fs');
                        document.body.classList.remove('lesson-video-pseudo-fs');
                        try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) {}
                    };
                    fsBtn.onclick = () => {
                        if (inNativeFs()) {
                            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                            return;
                        }
                        if (isPseudoFs()) { exitPseudoFs(); return; }
                        const fn = frameWrap.requestFullscreen || frameWrap.webkitRequestFullscreen;
                        if (fn) {
                            try {
                                const p = fn.call(frameWrap);
                                if (p && typeof p.then === 'function') {
                                    p.catch(() => enterPseudoFs());
                                }
                            } catch (e) {
                                enterPseudoFs();
                            }
                        } else {
                            enterPseudoFs();
                        }
                    };
                    // Allow Esc / back gesture to leave pseudo-fullscreen.
                    document.addEventListener('keydown', e => {
                        if (e.key === 'Escape' && isPseudoFs()) exitPseudoFs();
                    });
                }
                // Update progress + time every 500ms
                progressTimer = setInterval(() => {
                    try {
                        const cur = player.getCurrentTime() || 0;
                        const dur = player.getDuration() || 0;
                        if (timeEl) timeEl.textContent = `${fmt(cur)} / ${fmt(dur)}`;
                        if (progressFill && dur > 0) progressFill.style.width = ((cur / dur) * 100) + '%';
                    } catch (e) {}
                }, 500);
                // Stop timer if the wrap is removed from DOM
                const obs = new MutationObserver(() => {
                    if (!document.body.contains(frameWrap)) {
                        clearInterval(progressTimer);
                        obs.disconnect();
                    }
                });
                obs.observe(document.body, { childList: true, subtree: true });
            });
        }


        const TTS_KEY = 'mathPracticeTTS';
        let ttsEnabled = false; // auto-read disabled — manual speaker buttons only

        // Speaker icon SVG
        const SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';

        function makeSpeakBtn(getText, title){

        function arraysEqualAsSets(a, b) {
            if (a.length !== b.length) return false;
            const sa = [...a].sort(), sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        // ===== Hard mode (prefer previously-wrong questions) =====
        const HARD_KEY = 'mathPracticeHard';
        const WRONG_KEY = 'mathPracticeWrong'; // map: { sig: count }
        let hardMode = (localStorage.getItem(HARD_KEY) === '1');
        function loadWrong() {
            try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); } catch(_) { return {}; }
        }
        function saveWrong(obj) {
            try { localStorage.setItem(WRONG_KEY, JSON.stringify(obj)); } catch(_){}
        }
        function qSig(q) {
            // stable signature: topic + question text
            return (q._topic || '') + '|' + (q.question || '');
        }
        function markWrong(q) {
            const w = loadWrong();
            const k = qSig(q);
            w[k] = (w[k] || 0) + 1;
            saveWrong(w);
        }
        function clearWrong(q) {
            const w = loadWrong();
            const k = qSig(q);
            if (w[k]) { delete w[k]; saveWrong(w); }
        }

        // ===== Per-topic mastery (avg % across saved reports) =====
        // Cache: { topicKey: { sum: <total percentage>, count: <session count> } }
        let topicAvgCache = {};
        function masteryPctFor(topicKey) {
            const entry = topicAvgCache[topicKey];
            if (!entry || !entry.count) return null;
            return Math.round(entry.sum / entry.count);
        }
        function masterySamplesFor(topicKey) {
            const entry = topicAvgCache[topicKey];
            return entry ? entry.count : 0;
        }
        function refreshTopicAvgsFromReports() {
            if (typeof db === 'undefined') return Promise.resolve();
            return db.ref('mathReports/' + currentProfile).once('value').then(snap => {
                const data = snap.val() || {};
                const acc = {};
                Object.values(data).forEach(r => {
                    // Only count single-topic sessions toward that topic's average.
                    // Skip 'All Topics (mixed)' and 'Missed questions only' buckets.
                    if (!r || r.category === '__all__') return;
                    if (r.topicLabel === 'All Topics (mixed)') return;
                    if (r.topicLabel === 'Missed questions only') return;
                    const key = r.category || r.topicLabel;
                    if (!key) return;
                    if (!acc[key]) acc[key] = { sum: 0, count: 0 };
                    acc[key].sum += (r.percentage || 0);
                    acc[key].count += 1;
                });
                topicAvgCache = acc;
                if (typeof refreshCategoryMastery === 'function') refreshCategoryMastery();
                // If the picker overlay is open, re-render it.
                const overlay = document.getElementById('topicPickerOverlay');
                if (overlay && overlay.style.display === 'flex' && typeof renderTopicPicker === 'function') {
                    renderTopicPicker();
                }
            }).catch(()=>{});
        }

        // ===== Recently-seen tracking (avoid showing the same Qs back-to-back) =====
        // Keyed per topic: { topicKey: [sig1, sig2, ...] } most-recent last.
        const RECENT_KEY = profileKey('mathPracticeRecent');
        const RECENT_CAP_PER_TOPIC = 30; // remember ~last 30 per topic
        function loadRecent() {
            try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '{}'); } catch(_) { return {}; }
        }
        function saveRecent(obj) {
            try { localStorage.setItem(RECENT_KEY, JSON.stringify(obj)); } catch(_){}
        }
        function recordRecent(questions) {
            if (!questions || !questions.length) return;
            const r = loadRecent();
            questions.forEach(q => {
                const topic = q._topic || '__all__';
                const list = r[topic] || [];
                const sig = qSig(q);
                const idx = list.indexOf(sig);
                if (idx !== -1) list.splice(idx, 1);
                list.push(sig);
                while (list.length > RECENT_CAP_PER_TOPIC) list.shift();
                r[topic] = list;
            });
            saveRecent(r);
        }
        function recentSetFor(pool) {
            // Build a Set of sigs that are "recently seen" — across all topics that appear in pool.
            const r = loadRecent();

        // ===== Answer-choice shuffling =====
        function shuffleQuestionOptions(q) {
            // Don't shuffle T/F (label order matters), numerics, or multi-line "ordering" answers
            if (q.type === 'tf' || q.type === 'numeric' || !q.options) return q;
            const idxs = q.options.map((_, i) => i);
            const order = shuffle(idxs); // new positions
            // order[newPos] = oldIdx → so newOptions[newPos] = oldOptions[oldIdx]
            const newOptions = order.map(oldIdx => q.options[oldIdx]);
            // Build oldIdx -> newIdx map
            const oldToNew = {};
            order.forEach((oldIdx, newIdx) => { oldToNew[oldIdx] = newIdx; });
            let newAnswer;
            if (Array.isArray(q.answer)) {
                newAnswer = q.answer.map(i => oldToNew[i]).sort((a,b)=>a-b);
            } else {
                newAnswer = oldToNew[q.answer];
            }
            return { ...q, options: newOptions, answer: newAnswer };
        }

        // ===== Sample N questions, optionally weighted toward wrong-answered =====
        const SESSION_SIZE = 10;
        const ALL_SESSION_SIZE = 50;
        function pickSession(pool, n) {
            if (pool.length <= n) return shuffle(pool);
            const recent = recentSetFor(pool);
            const freshPool = pool.filter(q => !recent.has(qSig(q)));
            const stalePool = pool.filter(q => recent.has(qSig(q)));
            if (hardMode) {
                const wrong = loadWrong();
                const wrongQs = pool.filter(q => wrong[qSig(q)]);
                const otherQs = pool.filter(q => !wrong[qSig(q)]);
                const shuffledWrong = shuffle(wrongQs);
                const shuffledOther = shuffle(otherQs);
                const out = shuffledWrong.slice(0, n);
                if (out.length < n) out.push(...shuffledOther.slice(0, n - out.length));
                return shuffle(out);
            }
            // Prefer fresh questions; only dip into recently-seen if not enough fresh remain.
            if (freshPool.length >= n) return shuffle(freshPool).slice(0, n);
            const out = shuffle(freshPool);
            out.push(...shuffle(stalePool).slice(0, n - out.length));
            return shuffle(out);
        }

        function normalizeNumeric(input) {
            if (input == null) return null;
            const s = String(input).trim().replace(/,/g, '').replace(/\$/g, '');
            if (s === '') return null;
            // Support simple fractions like "2/12" or "1 1/3"
            const mixed = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
            if (mixed) {
                const whole = parseInt(mixed[1], 10);
                const num   = parseInt(mixed[2], 10);
                const den   = parseInt(mixed[3], 10);
                if (den === 0) return null;
                const sign = whole < 0 ? -1 : 1;
                return whole + sign * (num / den);
            }
            const frac = s.match(/^(-?\d+)\/(-?\d+)$/);
            if (frac) {
                const num = parseInt(frac[1], 10);
                const den = parseInt(frac[2], 10);
                if (den === 0) return null;
                return num / den;
            }
            const n = Number(s);
            return Number.isFinite(n) ? n : null;
        }

        // -------- donuts --------
        // Single ring at r=15.9 with two stacked arcs: green (correct) starts at
        // 12 o'clock and grows clockwise; red (wrong) starts where green ends.
        // With the SVG rotated -90deg, stroke-dashoffset=25 anchors the dash to
        // the top of the circle. Pushing the red arc forward by `correctLen`
        // means subtracting it from that offset.
        function updateDonuts(correct, wrong, total) {
            const remaining = Math.max(total - correct - wrong, 0);
            document.getElementById('remainingCount').textContent = remaining;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            const t = Math.max(total, 1);
            const correctLen = (correct / t) * 100;
            const wrongLen = (wrong / t) * 100;
            const correctEl = document.getElementById('donutCorrect');
            const wrongEl = document.getElementById('donutWrong');
            correctEl.setAttribute('stroke-dasharray', `${correctLen} ${100 - correctLen}`);
            correctEl.setAttribute('stroke-dashoffset', '25');
            wrongEl.setAttribute('stroke-dasharray', `${wrongLen} ${100 - wrongLen}`);
            // Shift red so it starts where green ended (mod 100).
            wrongEl.setAttribute('stroke-dashoffset', String((25 - correctLen + 100) % 100));
            const cT = document.getElementById('donutCorrectTitle'); if (cT) cT.textContent = `Correct: ${correct}`;
            const wT = document.getElementById('donutWrongTitle');   if (wT) wT.textContent = `Wrong: ${wrong}`;
        }

        // -------- render --------
        const container = document.getElementById('quizContainer');

        function render(category, restore) {
            container.innerHTML = '';
            initProfileAvatar();
            let questions, topicLabel, lessonHTML, lessonVideos;
            // Pool builder: read consolidated per-topic question list.
            function poolForTopic(key) {
                const arr = (mathPracticeQuestions && mathPracticeQuestions[key]) || [];
                return arr.map(q => ({ ...q, _topic: key }));
            }
            // Build a global pool containing only previously-missed questions across all topics.
            function buildMissedOnlyPool() {
                let wrongMap = {};
                try { wrongMap = JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); } catch(_) {}
                const sigs = Object.keys(wrongMap);
                if (!sigs.length) return [];
                const out = [];
                for (const key in mathPracticeQuestions) {
                    (mathPracticeQuestions[key] || []).forEach(q => {
                        const sig = key + '|' + (q.question || '');
                        if (wrongMap[sig]) out.push({ ...q, _topic: key });
                    });
                }
                return out;
            }
            if (restore && restore.questions && restore.questions.length) {
                questions = restore.questions;
                topicLabel = restore.topicLabel || null;
                lessonHTML = restore.lessonHTML || null;
                lessonVideos = restore.lessonVideos || (restore.lessonVideo ? [restore.lessonVideo] : []);
            } else if (hardMode) {
                // "Missed questions only" mode: pull from all topics, missed only.
                const missedPool = buildMissedOnlyPool();
                if (!missedPool.length) {
                    container.innerHTML = `
                        <div class="quiz-result" style="color:#333;">
                            <div style="font-size:42px;margin-bottom:8px;">🎉</div>
                            No missed questions yet!<br>
                            <div style="font-size:14px;font-weight:400;color:#666;margin-top:8px;max-width:360px;margin-left:auto;margin-right:auto;">Turn off <b>Missed questions only</b> in the menu to start a regular practice session.</div>
                        </div>`;
                    updateDonuts(0,0,0);
                    return;
                }
                const n = Math.min(missedPool.length, SESSION_SIZE);
                questions = shuffle(missedPool).slice(0, n).map(shuffleQuestionOptions);
                recordRecent(questions);
                topicLabel = 'Missed questions only';
                lessonHTML = null;
                lessonVideos = [];
            } else if (category === '__all__') {
                const all = [];
                for (const k in mathPracticeQuestions) {
                    all.push(...poolForTopic(k));
                }
                questions = pickSession(all, ALL_SESSION_SIZE).map(shuffleQuestionOptions);
                recordRecent(questions);
                topicLabel = null;
                lessonHTML = null;
                lessonVideos = [];
            } else {
                const meta = (typeof mathPracticeTopics !== 'undefined' && mathPracticeTopics[category]) || null;
                const pool = poolForTopic(category);
                questions = pickSession(pool, SESSION_SIZE).map(shuffleQuestionOptions);
                recordRecent(questions);
                topicLabel = category;
                lessonHTML = meta && meta.lesson ? meta.lesson : null;
                lessonVideos = (meta && Array.isArray(meta.videos)) ? meta.videos.slice() : (meta && meta.video ? [meta.video] : []);
            }
            if (!questions.length) {
                container.textContent = 'No questions in this topic.';
                updateDonuts(0,0,1);
                return;
            }

            let current = 0, correct = 0, wrong = 0, results = [];
            let currentQuestionStartedAt = 0; // ms epoch when current question rendered
            const sessionStartedAt = (restore && restore.startedAt) || new Date().toISOString();
            if (restore) {
                current = restore.current || 0;
                correct = restore.correct || 0;
                wrong = restore.wrong || 0;
                results = restore.results || [];
            }
            updateDonuts(correct, wrong, questions.length);

            function persistSession() {
                saveSession({
                    category, topicLabel, lessonHTML, lessonVideos,
                    questions, current, correct, wrong, results,
                    startedAt: sessionStartedAt,
                    timestamp: new Date().toISOString()
                });
            }

            // Expose a way to save an in-progress (partial) report — used by Reset
            // when a session is interrupted mid-way.
            window._mathCurrentSession = {
                hasProgress: () => results.length > 0,
                savePartialReport: () => {
                    if (results.length === 0) return false;
                    const answered = results.length;
                    const pct = Math.round((correct / answered) * 100);
                    saveReport({
                        date: new Date().toISOString(),
                        startedAt: sessionStartedAt,
                        category: category,
                        topicLabel: (topicLabel || (category === '__all__' ? 'All Topics (mixed)' : category)) + ' (partial)',
                        totalQuestions: answered,
                        correct: correct,
                        wrong: wrong,
                        percentage: pct,
                        hardMode: !!hardMode,
                        partial: true,
                        plannedTotal: questions.length,
                        results: results
                    });
                    return true;
                }
            };

            // Show lesson first if available (skip lesson if resuming mid-session)
            if ((lessonHTML || (lessonVideos && lessonVideos.length)) && !restore) {
                showLesson();
            } else {
                show();
            }

                const videoEntries = (lessonVideos || []).map((v) => {
                    if (!v || !v.id) return null;
                    const frameId = `ytFrame_${Math.random().toString(36).slice(2,8)}`;

                                    src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&modestbranding=1&iv_load_policy=3&fs=0&playsinline=1&controls=0&disablekb=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}"
                                    title="${v.title || 'Lesson video'}"
                                    frameborder="0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                    allowfullscreen

                                    <button type="button" class="lvc-btn" id="${frameId}_fs" title="Fullscreen">⛶</button>

                                </div>
                            </div>
                        </div>`;
                    return { frameId, html };
                }).filter(Boolean);
                const videosHTML = videoEntries.map(v => v.html).join('');
                const hasVideo = videoEntries.length > 0;
                const lessonBlock = lessonHTML ? `<div class="lesson-card" id="lessonCardContent">${lessonHTML}</div>` : '';
                container.innerHTML = `
                    <button type="button" class="topic-pill topic-pill-btn" onclick="window.openTopicPicker && window.openTopicPicker()" title="Switch topic">${topicLabel}</button>

                    </div>
                    ${videosHTML}
                    ${lessonBlock}

                document.getElementById('startPracticeBtn').onclick = () => { ttsCancel(); DailyTime.beginSession(); show(); };
                const lessonSpeakBtn = document.getElementById('lessonSpeakBtn');
                if (lessonSpeakBtn) {
                    lessonSpeakBtn.onclick = (e) => {

                        lessonSpeakBtn.classList.add('speaking');

            function show() {
                ttsCancel();
                const q = questions[current];
                currentQuestionStartedAt = Date.now();
                DailyTime.beginSession();

                // Header
                const header = document.createElement('div');
                header.innerHTML = `
                    ${(q._topic || lessonHTML) ? `<div class="topic-header-row">
                        ${q._topic ? `<button type="button" class="topic-pill topic-pill-btn" onclick="window.openTopicPicker && window.openTopicPicker()" title="Switch topic">${q._topic}</button>` : ''}
                        ${lessonHTML ? `<button class="lesson-toggle" id="lessonToggle">☰ Show lesson</button>` : ''}
                    </div>` : ''}

                            ${q.hint ? `<button class="hint-btn" id="hintBtn" title="Show hint">💡</button>` : ''}
                            <button class="speak-btn" id="questionSpeakBtn" title="Read question">${SPEAKER_SVG}</button>

                `;
                container.innerHTML = '';

                if (q.image) {
