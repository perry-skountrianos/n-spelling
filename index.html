<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Skountrianos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .apps {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        .app-link {
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }
        .app-link:hover {
            transform: scale(1.05);
        }
        .app-card {
            width: 140px;
            background: #fff;
            border-radius: 20px;
            padding: 1.5rem 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .app-icon {
            margin-bottom: 0.75rem;
            display: block;
        }
        .app-icon svg {
            width: 56px;
            height: 56px;
        }
        .app-name {
            font-size: 0.9rem;
            font-weight: 500;
        }
        /* Auth gate */
        .auth-gate {
            text-align: center;
            padding: 2rem;
        }
        .auth-gate input {
            font-size: 1rem;
            padding: 0.6rem 1rem;
            border: 2px solid #d2d2d7;
            border-radius: 10px;
            outline: none;
            width: 200px;
            text-align: center;
        }
        .auth-gate input:focus {
            border-color: #0071e3;
        }
        .auth-gate button {
            display: block;
            margin: 1rem auto 0;
            font-size: 1rem;
            padding: 0.6rem 2rem;
            background: #0071e3;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .auth-gate button:hover {
            background: #0077ed;
        }
        .auth-error {
            color: #ff3b30;
            font-size: 0.85rem;
            margin-top: 0.75rem;
        }
        /* Profile gate */
        .profile-gate {
            text-align: center;
            padding: 2rem 1rem;
        }
        .profile-gate-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2.25rem;
            color: #1d1d1f;
        }
        .profile-gate-list {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        .profile-gate-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            font-family: inherit;
            transition: transform 0.18s ease;
        }
        .profile-gate-card:hover { transform: scale(1.06); }
        .profile-gate-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #e0e0e0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .profile-gate-card:hover .profile-gate-circle {
            border-color: #0071e3;
            box-shadow: 0 10px 28px rgba(0,113,227,0.2);
        }
        .profile-gate-avatar { font-size: 4rem; line-height: 1; }
        .profile-gate-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1d1d1f;
        }
        /* Active profile chip on the apps screen */
        .profile-chip {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 6px;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1d1d1f;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            transition: border-color 0.18s ease;
        }
        .profile-chip:hover { border-color: #0071e3; }
        .profile-chip-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .profile-chip-switch {
            font-size: 0.78rem;
            color: #6e6e73;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Auth gate -->
    <div class="auth-gate" id="authGate">
        <div style="margin-bottom:1rem;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <input type="password" id="authPassword" placeholder="Password" autocomplete="off">
        <button id="authSubmit">Enter</button>
        <div class="auth-error" id="authError"></div>
    </div>

    <!-- Main content (hidden until authenticated) -->
    <div class="container" id="appWrapper" style="display:none;">
        <!-- Profile selection gate -->
        <div class="profile-gate" id="profileGate" style="display:none;"></div>

        <!-- Active profile chip (shown when on the apps screen) -->
        <button class="profile-chip" id="profileChip" style="display:none;" title="Switch player">
            <span class="profile-chip-circle" id="profileChipAvatar">🦁</span>
            <span>
                <span id="profileChipName">Nicholas</span>
                <span class="profile-chip-switch">Switch</span>
            </span>
        </button>

        <div class="apps" id="appsList" style="display:none;">
            <a href="spelling.html" class="app-link">
                <div class="app-card">
                    <span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
                    <span class="app-name">Spelling</span>
                </div>
            </a>
            <a href="quizes.html" class="app-link">
                <div class="app-card">
                    <span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="7" cy="7" r="1"/><circle cx="17" cy="7" r="1"/><circle cx="7" cy="17" r="1"/><circle cx="17" cy="17" r="1"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg></span>
                    <span class="app-name">Quizes</span>
                </div>
            </a>
            <a href="meal-planner.html" class="app-link">
                <div class="app-card">
                    <span class="app-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M5 12h14M8 17h8"/><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M7 17v2M17 17v2"/></svg></span>
                    <span class="app-name">Meal Planner</span>
                </div>
            </a>
            <!-- Sentences icon removed -->
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="profile.js?v=1"></script>
    <script>
        (function () {
            const gate     = document.getElementById('profileGate');
            const apps     = document.getElementById('appsList');
            const chip     = document.getElementById('profileChip');
            const chipName = document.getElementById('profileChipName');
            const chipAv   = document.getElementById('profileChipAvatar');

            function showApps(profile) {
                gate.style.display = 'none';
                apps.style.display = '';
                chip.style.display = '';
                chipName.textContent = profile.name;
                chipAv.textContent   = profile.avatar;
            }
            function showGate() {
                apps.style.display = 'none';
                chip.style.display = 'none';
                gate.style.display = '';
                Profiles.renderGate(gate, showApps);
            }

            chip.addEventListener('click', () => {
                Profiles.clearCurrent();
                showGate();
            });

            // Wait for the auth gate to reveal #appWrapper, then decide which view to show.
            function init() {
                if (document.getElementById('appWrapper').style.display === 'none') {
                    setTimeout(init, 80);
                    return;
                }
                const current = Profiles.getCurrent();
                if (current) showApps(current);
                else showGate();
            }
            init();
        })();
    </script>
</body>
</html>
