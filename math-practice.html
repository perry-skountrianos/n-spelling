                if (hintBtn && q.hint) {
                    hintBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (!hintDisplay) return; // No hint display div
                        if (hintDisplay.classList.contains('show')) {
                            hintDisplay.classList.remove('show');
                        } else {
                            hintDisplay.classList.add('show');
                            hintDisplay.textContent = q.hint;
                        }
                    };
                }
                const qBtn = document.getElementById('questionSpeakBtn');
                qBtn.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
                    qBtn.classList.add('speaking');
                    const parts = [q.question];
                    if (q.options) parts.push(...q.options);
                    if (q.labels) parts.push(...q.labels);
                    const text = htmlToReadable(parts.join('. '));
                    ttsSpeak(text, () => qBtn.classList.remove('speaking'));
                };
                if (ttsEnabled) {
                    setTimeout(() => qBtn.click(), 300);
                }

                if (q.type === 'multi') {
                    renderMulti(q);
                } else if (q.type === 'numeric') {
                    renderNumeric(q);
                } else if (q.type === 'tf') {
                    renderTF(q);
                } else {
                    renderMC(q);
                }

                // Explanation slot (populated by finishQuestion)
                const exp = document.createElement('div');
                exp.className = 'quiz-explanation';
                exp.dataset.text = q.explanation || '';
                container.appendChild(exp);

                renderLiveMissed();
            }

            function correctAnswerText(q) {
                if (q.type === 'numeric') {
                    return q.answer + (q.unit ? ' ' + q.unit : '');
                }
                if (q.type === 'tf') {
                    const labels = q.labels || ['True', 'False'];
                    return labels[q.answer];
                }
                if (q.type === 'multi') {
                    return (q.answer || []).map(i => q.options[i]).join(', ');
                }
                // mc
                return q.options ? q.options[q.answer] : '';
            }

            function escapeHTML(text) {
                return String(text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function equationSnapSteps(q) {
                return Array.isArray(q.resolveSteps) && q.resolveSteps.length ? q.resolveSteps : null;
            }

            function buildEquationSnapMarkup(q) {
                const steps = equationSnapSteps(q);
                if (!steps) return '';
                return `
                    <div class="equation-snap">
                        <span class="equation-snap-label">Equation snaps into place</span>
                        <div class="equation-snap-track">
                            ${steps.map((step, index) => `<div class="equation-snap-step${index === steps.length - 1 ? ' is-final' : ''}" style="--step-index:${index};">${escapeHTML(step)}</div>`).join('')}
                        </div>
                    </div>
                `;
            }

            let pendingTimeout = null;
            function finishQuestion(isCorrect, explanationDelay, userAnswer) {
                DailyTime.recordActivity();
                const q = questions[current];
                const elapsedMs = currentQuestionStartedAt ? (Date.now() - currentQuestionStartedAt) : 0;
                currentQuestionStartedAt = 0; // prevent double-counting if finish runs twice
                const snapSteps = isCorrect ? equationSnapSteps(q) : null;
                if (isCorrect) { correct++; clearWrong(q); }
                else { wrong++; markWrong(q); }
                results.push({
                    topic: q._topic || topicLabel || '',
                    question: q.question,
                    type: q.type || 'mc',
                    correctAnswer: correctAnswerText(q),
                    userAnswer: (userAnswer == null ? '' : String(userAnswer)),
                    explanation: q.explanation || '',
                    resolveSteps: Array.isArray(q.resolveSteps) ? q.resolveSteps.slice() : null,
                    isCorrect: isCorrect,
                    timeMs: elapsedMs
                });
                updateDonuts(correct, wrong, questions.length);
                persistSession();
                const exp = container.querySelector('.quiz-explanation');
                const text = exp ? exp.dataset.text : '';
                if (exp) {
                    exp.classList.add(isCorrect ? 'correct' : 'wrong');
                    let html = '';
                    if (isCorrect) {
                        html = '<span class="exp-title">✓ Correct!</span>';
                        html += buildEquationSnapMarkup(q);
                        if (text) html += '<div>' + text + '</div>';
                    } else {
                        html = '<span class="exp-title">💡 Step-by-step</span>';
                        html += '<span class="exp-correct-answer">Correct answer: ' + correctAnswerText(q) + '</span>';
                        if (text) html += '<div>' + text + '</div>';
                    }
                    html += '<div class="explanation-actions">';
                    if (!isCorrect) {
                        html += '<button class="speak-btn" id="expSpeakBtn" title="Read explanation">' + SPEAKER_SVG + '</button>';
                    }
                    html += '<button class="explain-next-btn" id="nextBtn" title="Next question">Next <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></button>';
                    html += '</div>';
                    exp.innerHTML = html;
                    exp.style.display = 'block';
                    const expBtn = document.getElementById('expSpeakBtn');
                    if (expBtn) {
                        expBtn.onclick = (e) => {
                            e.stopPropagation();
                            document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));
                            expBtn.classList.add('speaking');
                            const speech = 'Correct answer: ' + correctAnswerText(q) + '. ' + text;
                            ttsSpeak(htmlToReadable(speech), () => expBtn.classList.remove('speaking'));
                        };
                    }
                    const nextBtn = document.getElementById('nextBtn');
                    if (nextBtn) {
                        nextBtn.onclick = (e) => {
                            e.stopPropagation();
                            if (pendingTimeout) clearTimeout(pendingTimeout);
                            if (current < questions.length - 1) {
                                current++;
                                show();
                            } else {
                                ttsCancel();
                                showFinal();
                            }
                        };
                    }
                }
                renderLiveMissed();
                // Only auto-advance when the answer is correct. On wrong answers, wait for the
                // user to read the explanation and press Next explicitly.
                if (isCorrect) {
                    const defaultDelay = 1800;
                    const snapDelay = snapSteps ? 1200 + (snapSteps.length * 500) : defaultDelay;
                    const delay = explanationDelay != null ? explanationDelay : Math.max(defaultDelay, snapDelay);
                    pendingTimeout = setTimeout(() => {
                        if (current < questions.length - 1) {
                            current++;
                            show();
                        } else {
                            ttsCancel();
                            showFinal();
                        }
                    }, delay);
                }
            }

            function renderLiveMissed() {
                const wrongSoFar = results.filter(r => !r.isCorrect);
                let wrap = container.querySelector('#liveMissedWrap');
                
                // If no missed questions, remove the wrapper if it exists and return
                if (wrongSoFar.length === 0) {
                    if (wrap) wrap.remove();
                    return;
                }
                
                // If missed questions exist, create/update the wrapper
                if (!wrap) {
                    wrap = document.createElement('div');
                    wrap.id = 'liveMissedWrap';
                    wrap.className = 'live-missed-wrap';
                    container.appendChild(wrap);
                }

                wrap.innerHTML = `
                    <details class="report-details">
                        <summary>Questions missed so far (${wrongSoFar.length})</summary>
                        <div class="report-words">
                            ${wrongSoFar.map(r => {
                                const qShort = (r.question || '').replace(/<[^>]+>/g, '').slice(0, 120);
                                const stepsHtml = (Array.isArray(r.resolveSteps) && r.resolveSteps.length)
                                    ? `<ol style="margin:6px 0 0 18px;padding:0;font-size:12px;color:#444;">${r.resolveSteps.map(s => `<li>${escapeHTML(s)}</li>`).join('')}</ol>`
                                    : '';
                                const expHtml = r.explanation
                                    ? `<div style="font-size:12px;color:#555;margin-top:4px;">${r.explanation}</div>`
                                    : '';
                                const userHtml = r.userAnswer
                                    ? `<div style="font-size:12px;color:#c0392b;margin-top:2px;">Your answer: ${escapeHTML(r.userAnswer)}</div>`
                                    : '';
                                const timeHtml = answerTimeBadge(r.timeMs);
                                const vidHtml = videoLinkHTML(r.topic);
                                return `<div class="report-word-item"><div style="font-weight:600;color:#333;">${qShort}${qShort.length >= 120 ? '…' : ''}${timeHtml}${vidHtml}</div>${userHtml}<div style="font-size:12px;color:#2e7d32;margin-top:2px;">Correct: ${r.correctAnswer || ''}</div>${expHtml}${stepsHtml}</div>`;
                            }).join('')}
                        </div>
                    </details>
                `;
            }

            function showFinal() {
                DailyTime.endSession();
                const pct = Math.round((correct / questions.length) * 100);
                const wrongQs = results.filter(r => !r.isCorrect);
                // Save report and clear in-progress session
                saveReport({
                    date: new Date().toISOString(),
                    startedAt: sessionStartedAt,
                    category: category,
                    topicLabel: topicLabel || (category === '__all__' ? 'All Topics (mixed)' : category),
                    totalQuestions: questions.length,
                    correct: correct,
                    wrong: wrong,
                    percentage: pct,
                    hardMode: !!hardMode,
                    results: results
                });
                clearSession();
                const wrongDetailsHtml = `
                    <details class="report-details" style="margin-top:16px; text-align:left;">
                        <summary>Questions missed (${wrongQs.length})</summary>
                        <div class="report-words">
                            ${wrongQs.length > 0
                                ? wrongQs.map(r => {
                                    const qShort = (r.question || '').replace(/<[^>]+>/g, '').slice(0, 120);
                                    const stepsHtml = (Array.isArray(r.resolveSteps) && r.resolveSteps.length)
                                        ? `<ol style="margin:6px 0 0 18px;padding:0;font-size:12px;color:#444;">${r.resolveSteps.map(s => `<li>${escapeHTML(s)}</li>`).join('')}</ol>`
                                        : '';
                                    const expHtml = r.explanation
                                        ? `<div style="font-size:12px;color:#555;margin-top:4px;">${r.explanation}</div>`
                                        : '';
                                    const userHtml = r.userAnswer
                                        ? `<div style="font-size:12px;color:#c0392b;margin-top:2px;">Your answer: ${escapeHTML(r.userAnswer)}</div>`
                                        : '';
                                    const timeHtml = answerTimeBadge(r.timeMs);
                                    const vidHtml = videoLinkHTML(r.topic);
                                    return `<div class="report-word-item"><div style="font-weight:600;color:#333;">${qShort}${qShort.length >= 120 ? '…' : ''}${timeHtml}${vidHtml}</div>${userHtml}<div style="font-size:12px;color:#2e7d32;margin-top:2px;">Correct: ${r.correctAnswer || ''}</div>${expHtml}${stepsHtml}</div>`;
                                }).join('')
                                : '<div class="report-word-item"><div style="font-weight:600;color:#333;">No missed questions in this session.</div></div>'}
                        </div>
                    </details>
                `;
                container.innerHTML = `
                    <div class="quiz-result">
                        Practice complete!<br>
                        Score: ${correct} / ${questions.length} <span style="font-weight:500;color:#666;">(${pct}%)</span>
                        ${wrongDetailsHtml}
                        <button class="restart-btn" id="restartBtn">Practice again</button>
                    </div>
                `;
                document.getElementById('restartBtn').onclick = () => render(category);
            }

            // ---- renderers per type ----
            function renderMC(q) {
                const opts = document.createElement('div');
                opts.className = 'quiz-options';
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.textContent = opt;
                    btn.className = 'quiz-option';
                    btn.onclick = () => {
                        const isCorrect = (i === q.answer);
                        if (isCorrect) btn.classList.add('quiz-correct');
                        else {
                            btn.classList.add('quiz-wrong');
                            // highlight correct
                            opts.querySelectorAll('button')[q.answer].classList.add('quiz-correct');
                        }
                        Array.from(opts.querySelectorAll('button')).forEach(b => b.disabled = true);
                        finishQuestion(isCorrect, undefined, opt);
                    };
                    opts.appendChild(btn);
                });
                container.appendChild(opts);
            }

            function renderTF(q) {
                const labels = q.labels || ['True', 'False'];
                const opts = document.createElement('div');
                opts.className = 'quiz-options';
                labels.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.textContent = opt;
                    btn.className = 'quiz-option';
                    btn.onclick = () => {
                        const isCorrect = (i === q.answer);
                        if (isCorrect) btn.classList.add('quiz-correct');
                        else {
                            btn.classList.add('quiz-wrong');
                            opts.querySelectorAll('button')[q.answer].classList.add('quiz-correct');
                        }
                        Array.from(opts.querySelectorAll('button')).forEach(b => b.disabled = true);
                        finishQuestion(isCorrect, undefined, opt);
                    };
                    opts.appendChild(btn);
                });
                container.appendChild(opts);
            }

            function renderMulti(q) {
                const hint = document.createElement('div');
                hint.className = 'quiz-multi-hint';
                hint.textContent = 'Choose ALL that apply, then press Submit.';
                container.appendChild(hint);

                const opts = document.createElement('div');
                opts.className = 'quiz-options';
                const selected = new Set();
                q.options.forEach((opt, i) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'quiz-multi-option-wrapper';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'quiz-multi-checkbox';
                    checkbox.id = `multi-opt-${i}`;
                    checkbox.checked = false; // explicit: no default highlight on any option
                    checkbox.onchange = () => {
                        if (checkbox.checked) {
                            selected.add(i);
                            wrapper.classList.add('selected');
                        } else {
                            selected.delete(i);
                            wrapper.classList.remove('selected');
                        }
                    };

                    const label = document.createElement('label');
                    label.className = 'quiz-multi-option-label';
                    label.htmlFor = `multi-opt-${i}`;
                    label.textContent = opt;

                    wrapper.appendChild(checkbox);
                    wrapper.appendChild(label);
                    opts.appendChild(wrapper);
                });
                container.appendChild(opts);

                const submit = document.createElement('button');
                submit.className = 'quiz-submit-btn';
                submit.textContent = 'Submit';
                submit.onclick = () => {
                    const chosen = Array.from(selected);
                    const correctSet = q.answer;
                    const isCorrect = arraysEqualAsSets(chosen, correctSet);
                    const wrappers = Array.from(opts.querySelectorAll('.quiz-multi-option-wrapper'));
                    wrappers.forEach((wrapper, i) => {
                        const checkbox = wrapper.querySelector('input[type="checkbox"]');
                        checkbox.disabled = true;
                        const isAns = correctSet.includes(i);
                        const isPicked = chosen.includes(i);
                        wrapper.classList.remove('selected');
                        if (isAns && isPicked) wrapper.classList.add('correct');
                        else if (!isAns && isPicked) wrapper.classList.add('wrong');
                        else if (isAns && !isPicked) wrapper.classList.add('correct-missed');
                    });
                    submit.disabled = true;
                    const userAnswerText = chosen.length
                        ? chosen.map(i => q.options[i]).join(', ')
                        : '(no selection)';
                    finishQuestion(isCorrect, undefined, userAnswerText);
                };
                container.appendChild(submit);
            }

            function renderNumeric(q) {
                const wrap = document.createElement('div');
                wrap.style.display = 'flex';
                wrap.style.flexDirection = 'column';
                wrap.style.gap = '8px';
                const input = document.createElement('input');
                input.type = 'text';
                input.inputMode = 'decimal';
                input.autocomplete = 'off';
                input.className = 'quiz-numeric-input';
                input.placeholder = q.unit ? `Answer (${q.unit})` : 'Type your answer';
                // Restrict to numeric-style input: digits, decimal point, minus, fraction slash, space (for mixed numbers)
                input.addEventListener('input', () => {
                    const cleaned = input.value.replace(/[^0-9.\-/ ]/g, '');
                    if (cleaned !== input.value) input.value = cleaned;
                });
                input.addEventListener('keydown', (e) => {
                    // allow control keys
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    if (e.key.length > 1) return; // Backspace, Arrow, Tab, Enter, etc.
                    if (!/[0-9.\-/ ]/.test(e.key)) e.preventDefault();
                });
                wrap.appendChild(input);

                const submit = document.createElement('button');
                submit.className = 'quiz-submit-btn';
                submit.textContent = 'Submit';
                wrap.appendChild(submit);
                container.appendChild(wrap);
                setTimeout(() => input.focus(), 50);

                function check() {
                    const rawInput = (input.value || '').trim();
                    const userVal = normalizeNumeric(input.value);
                    if (userVal === null) {
                        input.classList.add('quiz-wrong');
                        input.disabled = true;
                        submit.disabled = true;
                        finishQuestion(false, undefined, rawInput || '(blank)');
                        return;
                    }
                    const expected = (typeof q.answer === 'string') ? normalizeNumeric(q.answer) : q.answer;
                    const tol = q.tolerance != null ? q.tolerance : 0.0001;
                    const isCorrect = Math.abs(userVal - expected) <= tol;
                    input.disabled = true;
                    submit.disabled = true;
                    if (isCorrect) {
                        input.classList.add('quiz-correct');
                    } else {
                        input.classList.add('quiz-wrong');
                    }
                    const userAnswerText = rawInput + (q.unit ? ' ' + q.unit : '');
                    finishQuestion(isCorrect, undefined, userAnswerText);
                }
                submit.onclick = check;
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !input.disabled) { e.preventDefault(); check(); }
                });
            }

            show();
        }

        // ===== Missed questions overlay =====
        const missedOverlay = document.getElementById('missedOverlay');
        const missedList = document.getElementById('missedList');
        function escapeHTMLTop(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        // Shared admin-password check for protected operations
        const ADMIN_PASSWORD = 'admin123';
        function requireAdminPassword(promptMsg) {
            const raw = window.prompt(promptMsg || 'Enter admin password:');
            if (raw === null) return false;
            if (String(raw).trim() !== ADMIN_PASSWORD) {
                alert('Incorrect password.');
                return false;
            }
            return true;
        }
        // Time-per-question helpers (shared across inline + reports views)
        function formatAnswerTime(ms) {
            if (!ms || ms < 0) return '';
            if (ms < 1000) return '<1s';
            const s = ms / 1000;
            if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + 's';
            const m = Math.floor(s / 60);
            const rem = Math.round(s - m * 60);
            return m + 'm ' + rem + 's';
        }
        function answerTimeColor(ms) {
            if (!ms) return '#888';
            if (ms >= 30000) return '#c0392b';  // slow → red
            if (ms >= 15000) return '#e67e22';  // medium → orange
            return '#2e7d32';                    // fast → green
        }
        function answerTimeBadge(ms) {
            if (!ms) return '';
            const color = answerTimeColor(ms);
            return '<span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;'
                 + 'background:' + color + '14;color:' + color + ';font-size:11px;font-weight:600;'
                 + 'vertical-align:middle;">⏱ ' + formatAnswerTime(ms) + '</span>';
        }
        function correctAnswerTextTop(q) {
            if (!q) return '';
            if (q.type === 'numeric') return q.answer + (q.unit ? ' ' + q.unit : '');
            if (q.type === 'tf') { const labels = q.labels || ['True','False']; return labels[q.answer]; }
            if (q.type === 'multi') return (q.answer || []).map(i => (q.options || [])[i]).join(', ');
            return q.options ? q.options[q.answer] : '';
        }
        // Return an inline "📺 Watch video" link for a topic key, or '' if no video is available.
        // Opens the in-app lesson modal (does NOT navigate to YouTube).
        function videoLinkHTML(topicKey) {
            try {
                const meta = (typeof mathPracticeTopics !== 'undefined') ? mathPracticeTopics[topicKey] : null;
                if (!meta) return '';
                const list = Array.isArray(meta.videos) ? meta.videos : (meta.video ? [meta.video] : []);
                if (!list.length && !meta.lesson) return '';
                const key = String(topicKey).replace(/"/g, '&quot;');
                return ' <button type="button" class="watch-video-btn" data-topic="' + key + '"'
                    + ' style="display:inline-block;margin-left:6px;padding:1px 8px;border-radius:8px;border:none;'
                    + 'background:#e3f2fd;color:#1565c0;font-size:11px;font-weight:600;cursor:pointer;'
                    + 'vertical-align:middle;font-family:inherit;">📺 watch video</button>';

        }

        // ===== In-app lesson modal =====
        const lessonModalOverlay = document.getElementById('lessonModalOverlay');
        const lessonModalTitle = document.getElementById('lessonModalTitle');
        const lessonModalBody = document.getElementById('lessonModalBody');
        function closeLessonModal() {
            if (!lessonModalOverlay) return;
            // Stop any playing iframes by clearing the body
            lessonModalBody.innerHTML = '';
            lessonModalOverlay.style.display = 'none';
        }
        document.getElementById('lessonModalCloseBtn').onclick = closeLessonModal;
        lessonModalOverlay.addEventListener('click', (e) => {
            if (e.target === lessonModalOverlay) closeLessonModal();
        });
        window.openLessonModal = function(topicKey) {
            const meta = (typeof mathPracticeTopics !== 'undefined') ? mathPracticeTopics[topicKey] : null;
            if (!meta) return;
            const list = Array.isArray(meta.videos) ? meta.videos : (meta.video ? [meta.video] : []);
            lessonModalTitle.textContent = topicKey;
            const videoEntries = list.map((v) => {
                if (!v || !v.id) return null;
                const frameId = `lmFrame_${Math.random().toString(36).slice(2,8)}`;
                const html = `
                    <div class="lesson-video-wrap">
                        <div class="lesson-video-title">🎥 ${escapeHTMLTop(v.title || 'Watch the video')}</div>
                        ${v.blurb ? `<div class="lesson-video-blurb">${v.blurb}</div>` : ''}
                        <div class="lesson-video-frame">
                            <iframe id="${frameId}"
                                src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&modestbranding=1&iv_load_policy=3&fs=0&playsinline=1&controls=0&disablekb=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}"
                                title="${escapeHTMLTop(v.title || 'Lesson video')}"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen
                                referrerpolicy="strict-origin-when-cross-origin"></iframe>
                            <div class="lesson-video-topcover" aria-hidden="true"></div>
                            <div class="lesson-video-clickcatch" id="${frameId}_click"></div>
                            <div class="lesson-video-controls" id="${frameId}_controls">
                                <button type="button" class="lvc-btn" id="${frameId}_playpause" title="Play / Pause">▶</button>
                                <div class="lvc-time" id="${frameId}_time">0:00 / 0:00</div>
                                <div class="lvc-progress" id="${frameId}_progress">
                                    <div class="lvc-progress-fill" id="${frameId}_progressfill"></div>
                                </div>
                                <button type="button" class="lvc-btn" id="${frameId}_fs" title="Fullscreen">⛶</button>
                            </div>
                            <div class="lesson-video-shield" id="${frameId}_shield">
                                <button type="button" class="lesson-video-resume" id="${frameId}_resume">▶ Play video</button>
                            </div>
                        </div>
                    </div>`;
                return { frameId, html };
            }).filter(Boolean);
            const videosHTML = videoEntries.map(v => v.html).join('');
            const lessonBlock = meta.lesson ? `<div class="lesson-card">${meta.lesson}</div>` : '';
            lessonModalBody.innerHTML = videosHTML + lessonBlock;
            lessonModalOverlay.style.display = 'flex';
            // Attach YouTube custom-controls shield, if the helper exists in this scope
            if (typeof attachYouTubeShield === 'function') {
                videoEntries.forEach(v => { try { attachYouTubeShield(v.frameId); } catch(_) {} });
            }
        };
        // Delegate clicks on every "📺 watch video" button to openLessonModal
        document.addEventListener('click', (e) => {
            const btn = e.target.closest && e.target.closest('.watch-video-btn');
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            const topic = btn.getAttribute('data-topic');
            if (topic) window.openLessonModal(topic);
        });
        function buildQuestionIndex() {
            const map = {};
            for (const key in mathPracticeQuestions) {
                (mathPracticeQuestions[key] || []).forEach(q => {
                    const sig = key + '|' + (q.question || '');
                    map[sig] = { q, topic: key };
                });
            }
            return map;
        }
        function renderMissedList() {
            const wrong = (function(){
                try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); } catch(_) { return {}; }
            })();
            const sigs = Object.keys(wrong);
            if (!sigs.length) {
                missedList.innerHTML = '<p class="reports-loading">No missed questions yet. Nice work!</p>';
                return;
            }
            const idx = buildQuestionIndex();
            // Sort: highest miss count first, then by topic
            sigs.sort((a, b) => (wrong[b] || 0) - (wrong[a] || 0) || a.localeCompare(b));
            const html = sigs.map(sig => {
                const entry = idx[sig];
                const sep = sig.indexOf('|');
                const topicFromSig = sep >= 0 ? sig.slice(0, sep) : '';
                const qText = entry ? (entry.q.question || '') : (sep >= 0 ? sig.slice(sep + 1) : sig);
                const qShort = qText.replace(/<[^>]+>/g, '').slice(0, 160);
                const correct = entry ? correctAnswerTextTop(entry.q) : '';
                const expl = entry && entry.q && entry.q.explanation ? entry.q.explanation : '';
                const steps = entry && entry.q && Array.isArray(entry.q.resolveSteps) ? entry.q.resolveSteps : null;
                const count = wrong[sig] || 0;
                const stepsHtml = (steps && steps.length)
                    ? `<ol style="margin:6px 0 0 18px;padding:0;font-size:12px;color:#444;">${steps.map(s => `<li>${escapeHTMLTop(s)}</li>`).join('')}</ol>`
                    : '';
                const expHtml = expl ? `<div style="font-size:12px;color:#555;margin-top:4px;">${expl}</div>` : '';
                const correctHtml = correct ? `<div style="font-size:12px;color:#2e7d32;margin-top:2px;">Correct: ${escapeHTMLTop(correct)}</div>` : '';
                const topicHtml = topicFromSig ? `<div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">${escapeHTMLTop(topicFromSig)} · missed ${count}×</div>` : '';
                const vidHtml = videoLinkHTML(topicFromSig);
                return `
                    <div class="report-word-item" data-sig="${escapeHTMLTop(sig)}" style="position:relative;padding-right:34px;">
                        <button class="missed-del-btn" title="Remove" data-sig="${escapeHTMLTop(sig)}" style="position:absolute;top:8px;right:8px;background:none;border:none;color:#999;font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;">×</button>
                        ${topicHtml}
                        <div style="font-weight:600;color:#333;">${escapeHTMLTop(qShort)}${qShort.length >= 160 ? '…' : ''}${vidHtml}</div>
                        ${correctHtml}${expHtml}${stepsHtml}
                    </div>`;
            }).join('');
            missedList.innerHTML = html;
            missedList.querySelectorAll('.missed-del-btn').forEach(btn => {
                btn.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    const sig = btn.getAttribute('data-sig');
                    const w = (function(){ try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); } catch(_) { return {}; } })();
                    if (w[sig]) { delete w[sig]; try { localStorage.setItem(WRONG_KEY, JSON.stringify(w)); } catch(_){} }
                    renderMissedList();
                });
            });
        }
        document.getElementById('viewMissedBtn').onclick = () => {
            gearDropdown.classList.remove('show');
            missedOverlay.style.display = 'flex';
            renderMissedList();
        };
        document.getElementById('missedCloseBtn').onclick = () => {
            missedOverlay.style.display = 'none';
        };
        document.getElementById('missedClearAllBtn').onclick = () => {
            if (!confirm('Clear all missed questions?')) return;
            try { localStorage.setItem(WRONG_KEY, '{}'); } catch(_){}
            renderMissedList();
        };

        // Build the 14-day practice-time mini-grid shown at the top of Reports overlay.
        function buildDailyHistorySection() {
            const wrap = document.createElement('div');
            wrap.className = 'daily-history-wrap';
            const history = DailyTime.getHistory(14);
            const goalSec = DailyTime.getGoalSeconds();
            const todayKey = (function(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
            const totalSec = history.reduce((s, d) => s + d.seconds, 0);
            const goalMin = Math.round(goalSec / 60);
            const totalLabel = totalSec >= 60
                ? Math.floor(totalSec / 60) + ' min'
                : (totalSec > 0 ? Math.round(totalSec) + ' sec' : '0 min');
            // Streak: consecutive days ending today that met the goal
            let streak = 0;
            for (let i = history.length - 1; i >= 0; i--) {
                if (history[i].seconds >= goalSec) streak++; else break;
            }
            const streakHtml = streak > 0 ? `<span style="color:#1f7a35;">🔥 ${streak}-day streak</span>` : '<span style="color:#999;">No streak yet</span>';
            wrap.innerHTML = `
                <div class="daily-history-title">
                    <span>⏱ Practice time · last 14 days · goal ${goalMin} min/day</span>
                    <span class="dh-total">${streakHtml} · ${totalLabel} total</span>
                </div>
                <div class="daily-history-grid" id="dailyHistoryGrid"></div>
            `;
            const grid = wrap.querySelector('#dailyHistoryGrid');
            history.forEach(d => {
                const cell = document.createElement('div');
                cell.className = 'daily-history-cell';
                const mins = Math.floor(d.seconds / 60);
                const ratio = Math.min(1, d.seconds / goalSec);
                if (ratio > 0) {
                    cell.classList.add('has-progress');
                    // Green intensity proportional to ratio
                    const baseAlpha = 0.25 + ratio * 0.55;
                    cell.style.background = `rgba(46, 160, 67, ${baseAlpha.toFixed(2)})`;
                }
                if (d.ymd === todayKey) cell.classList.add('is-today');
                const dayNum = d.date.getDate();
                const cellLabel = mins > 0 ? mins + 'm' : (d.seconds > 0 ? Math.round(d.seconds) + 's' : '');
                cell.innerHTML = `<span class="dh-date">${dayNum}</span>${cellLabel ? `<span>${cellLabel}</span>` : ''}`;
                cell.title = d.ymd + ': ' + (d.seconds > 0 ? (mins > 0 ? mins + ' min ' : '') + Math.round(d.seconds % 60) + ' sec' : 'no practice');
                grid.appendChild(cell);
            });
            return wrap;
        }

        function loadReports() {
            reportsList.innerHTML = '<p class="reports-loading">Loading reports...</p>';
            if (typeof db === 'undefined') {
                reportsList.innerHTML = '<p class="reports-loading">Firebase not available.</p>';
                return;
            }
            db.ref('mathReports/' + currentProfile).orderByKey().once('value').then(snapshot => {
                const data = snapshot.val();
                if (!data) {
                    reportsList.innerHTML = '';
                    try { reportsList.appendChild(buildDailyHistorySection()); } catch(_) {}
                    reportsList.insertAdjacentHTML('beforeend', '<p class="reports-loading">No reports saved yet.</p>');
                    return;
                }
                const reports = Object.entries(data).sort((a, b) => Number(b[0]) - Number(a[0]));

                // Group by topic. Mixed sessions land in their own bucket.
                const MIXED_KEY = '__mixed__';
                const groups = {}; // key -> { label, reports: [...] }
                reports.forEach(([id, report]) => {
                    let groupKey, groupLabel;
                    if (report.category === '__all__' || report.topicLabel === 'All Topics (mixed)') {
                        groupKey = MIXED_KEY;
                        groupLabel = '🎲 All Topics (mixed)';
                    } else if (report.topicLabel === 'Missed questions only') {
                        groupKey = '__missed_only__';
                        groupLabel = '🎯 Missed questions only';
                    } else {
                        groupKey = report.category || report.topicLabel || 'Math';
                        groupLabel = report.topicLabel || report.category || 'Math';
                    }
                    if (!groups[groupKey]) groups[groupKey] = { label: groupLabel, reports: [] };
                    groups[groupKey].reports.push([id, report]);
                });

                // Order: every topic in mathPracticeQuestions (in declaration order), then Mixed, then Missed-only.
                const orderedKeys = [];
                for (const k in mathPracticeQuestions) {
                    if (groups[k]) orderedKeys.push(k);
                }
                if (groups[MIXED_KEY]) orderedKeys.push(MIXED_KEY);
                if (groups['__missed_only__']) orderedKeys.push('__missed_only__');
                // Anything left over (legacy keys we didn't expect)
                for (const k of Object.keys(groups)) {
                    if (!orderedKeys.includes(k)) orderedKeys.push(k);
                }

                reportsList.innerHTML = '';
                // Practice-time history (14 days)
                try { reportsList.appendChild(buildDailyHistorySection()); } catch(_) {}
                orderedKeys.forEach((groupKey, groupIdx) => {
                    const group = groups[groupKey];
                    const sec = document.createElement('details');
                    sec.className = 'report-group';
                    if (groupIdx === 0) sec.open = true; // expand first group by default
                    const totalRuns = group.reports.length;
                    const avgPct = Math.round(
                        group.reports.reduce((s, [, r]) => s + (r.percentage || 0), 0) / totalRuns
                    );
                    const avgColor = masteryColor(avgPct);
                    const sum = document.createElement('summary');
                    sum.className = 'report-group-summary';
                    sum.innerHTML = `
                        <span class="report-group-name">${group.label}</span>
                        <span class="report-group-meta">
                            <span class="report-group-count">${totalRuns} session${totalRuns === 1 ? '' : 's'}</span>
                            <span class="report-group-avg" style="color:${avgColor};">avg ${avgPct}%</span>
                        </span>
                    `;
                    sec.appendChild(sum);
                    const groupBody = document.createElement('div');
                    groupBody.className = 'report-group-body';

                    group.reports.forEach(([id, report]) => {
                        const date = new Date(report.date);
                        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                        const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                        const card = document.createElement('div');
                        card.className = 'report-card';
                        const scoreClass = report.percentage >= 80 ? 'report-score-good' : report.percentage >= 50 ? 'report-score-ok' : 'report-score-low';
                        // Per-question timing summary (if recorded)
                        let timingSummaryHtml = '';
                        if (report.results && report.results.length) {
                            const timed = report.results.filter(r => r.timeMs > 0);
                            if (timed.length) {
                                const total = timed.reduce((s, r) => s + r.timeMs, 0);
                                const avg = total / timed.length;
                                const slow = timed.filter(r => r.timeMs >= 30000).length;
                                timingSummaryHtml = ' <span style="font-size:12px;color:#666;">'
                                    + '· avg ' + formatAnswerTime(avg) + '/q'
                                    + (slow ? ', <span style="color:#c0392b;font-weight:600;">' + slow + ' slow</span>' : '')
                                    + '</span>';
                            }
                        }
                        card.innerHTML = `
                            <div class="report-card-header">
                                <div class="report-date">${dateStr} at ${timeStr}${report.hardMode ? '<div style="font-size:11px;color:#0071e3;font-weight:600;margin-top:2px;">\ud83c\udfaf Missed only</div>' : ''}${report.partial ? '<div style="font-size:11px;color:#b26a00;font-weight:600;margin-top:2px;">\u23f8 Partial</div>' : ''}</div>
                                <div class="report-score ${scoreClass}">${report.percentage}%</div>
                                <button class="report-delete-btn" type="button" title="Delete this report (admin)" aria-label="Delete report">\u00d7</button>
                            </div>
                            <div class="report-summary">${report.correct} correct, ${report.wrong} wrong out of ${report.totalQuestions} questions${timingSummaryHtml}</div>
                        `;
                        const delBtn = card.querySelector('.report-delete-btn');
                        if (delBtn) {
                            delBtn.addEventListener('click', (ev) => {
                                ev.stopPropagation();
                                ev.preventDefault();
                                if (!requireAdminPassword('Enter admin password to delete this report:')) return;
                                if (typeof db === 'undefined') {
                                    alert('Database not available.');
                                    return;
                                }
                                delBtn.disabled = true;
                                db.ref('mathReports/' + currentProfile + '/' + id).remove()
                                    .then(() => {
                                        refreshTopicAvgsFromReports();
                                        loadReports();
                                    })
                                    .catch(e => {
                                        delBtn.disabled = false;
                                        alert('Delete failed: ' + (e && e.message ? e.message : e));
                                    });
                            });
                        }
                        if (report.results) {
                            const wrongQs = report.results.filter(r => !r.isCorrect);
                            if (wrongQs.length > 0) {
                                const details = document.createElement('details');
                                details.className = 'report-details';
                                const summary = document.createElement('summary');
                                summary.textContent = `Questions missed (${wrongQs.length})`;
                                details.appendChild(summary);
                                const wordsList = document.createElement('div');
                                wordsList.className = 'report-words';
                                wrongQs.forEach(r => {
                                    const qShort = (r.question || '').replace(/<[^>]+>/g, '').slice(0, 90);
                                    const userHtml = r.userAnswer
                                        ? `<div style="font-size:12px;color:#c0392b;margin-top:2px;">Your answer: ${escapeHTMLTop(r.userAnswer)}</div>`
                                        : '';
                                    const timeHtml = answerTimeBadge(r.timeMs);
                                    const vidHtml = videoLinkHTML(r.topic || report.category);
                                    wordsList.innerHTML += `<div class="report-word-item"><div style="font-weight:600;color:#333;">${qShort}${qShort.length >= 90 ? '\u2026' : ''}${timeHtml}${vidHtml}</div>${userHtml}<div style="font-size:12px;color:#2e7d32;margin-top:2px;">Correct: ${r.correctAnswer || ''}</div></div>`;
                                });
                                details.appendChild(wordsList);
                                card.appendChild(details);
                            }
                            // All questions with timing (correct + wrong), sorted slowest first
                            const timedAll = report.results.filter(r => r.timeMs > 0);
                            if (timedAll.length > 0) {
                                const allDetails = document.createElement('details');
                                allDetails.className = 'report-details';
                                const allSummary = document.createElement('summary');
                                allSummary.textContent = `All questions \u00b7 timing (${timedAll.length})`;
                                allDetails.appendChild(allSummary);
                                const allList = document.createElement('div');
                                allList.className = 'report-words';
                                const sorted = timedAll.slice().sort((a, b) => (b.timeMs || 0) - (a.timeMs || 0));
                                sorted.forEach(r => {
                                    const qShort = (r.question || '').replace(/<[^>]+>/g, '').slice(0, 90);
                                    const statusIcon = r.isCorrect
                                        ? '<span style="color:#2e7d32;font-weight:700;margin-right:6px;">\u2713</span>'
                                        : '<span style="color:#c0392b;font-weight:700;margin-right:6px;">\u2717</span>';
                                    const timeHtml = answerTimeBadge(r.timeMs);
                                    const vidHtml = !r.isCorrect ? videoLinkHTML(r.topic || report.category) : '';
                                    const userHtml = (!r.isCorrect && r.userAnswer)
                                        ? `<div style="font-size:12px;color:#c0392b;margin-top:2px;">Your answer: ${escapeHTMLTop(r.userAnswer)}</div>`
                                        : '';
                                    const correctHtml = !r.isCorrect
                                        ? `<div style="font-size:12px;color:#2e7d32;margin-top:2px;">Correct: ${r.correctAnswer || ''}</div>`
                                        : '';
                                    allList.innerHTML += `<div class="report-word-item"><div style="font-weight:600;color:#333;">${statusIcon}${qShort}${qShort.length >= 90 ? '\u2026' : ''}${timeHtml}${vidHtml}</div>${userHtml}${correctHtml}</div>`;
                                });
                                allDetails.appendChild(allList);
                                card.appendChild(allDetails);
                            }
                        }
                        groupBody.appendChild(card);
                    });
                    sec.appendChild(groupBody);
                    reportsList.appendChild(sec);
                });
            }).catch(e => {
                console.warn('Failed to load math reports:', e);
                reportsList.innerHTML = '<p class="reports-loading">Failed to load reports.</p>';
            });
        }

        // Default to Day 1 if available, else mixed; resume saved session if any
        const firstKey = Object.keys(mathPracticeQuestions)[0];
        if (firstKey) categorySelect.value = firstKey;
        // Initialize profile avatar immediately
        function initProfileAvatar() {
            const avatarEl = document.getElementById('profileAvatar');
            if (!avatarEl) return;

            const applyAvatar = (profile) => {
                if (profile && profile.avatar) avatarEl.innerHTML = emojiToImg(profile.avatar, 36);
            };

            if (typeof db !== 'undefined') {
                db.ref('profiles/' + currentProfile).once('value').then(snapshot => {
                    const profile = snapshot.val();
                    if (profile) applyAvatar(profile);
                    else applyAvatar(Profiles.getCurrent());
                }).catch(() => {
                    applyAvatar(Profiles.getCurrent());
                });
            } else {
                applyAvatar(Profiles.getCurrent());
            }
        }
        initProfileAvatar();

        loadSession().then(saved => {
            if (saved && saved.questions && saved.current < saved.questions.length) {
                if (saved.category && (saved.category === '__all__' || mathPracticeQuestions[saved.category])) {
                    categorySelect.value = saved.category;
                }
                render(saved.category || categorySelect.value, saved);
            } else {
                render(categorySelect.value);
            }
        });
    })();
    </script>
</body>
