<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="styles.css?v=25">
    <link rel="stylesheet" href="meal-planner.css?v=14">
</head>
<body>
    <div class="score-display meal-topbar">
        <a href="index.html" class="home-circle" title="Home">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <button type="button" class="profile-circle profile-switcher" id="profileSwitcher" title="Switch player">
            <span class="profile-circle-avatar" id="profileSwitcherAvatar">🦁</span>
        </button>
        <div class="topbar-divider"></div>
        <div class="food-rings" id="foodRings"></div>
        <div class="gear-menu-wrapper" id="gearMenuWrapper" style="margin-left: auto; position: static !important;">
            <button class="menu-btn" id="gearBtn" title="Menu"><span class="menu-icon"><span></span><span></span><span></span></span></button>
            <div class="gear-dropdown" id="gearDropdown">
                <button class="gear-option" id="switchProfileBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Switch Player</button>
                <button class="gear-option gear-option-danger" id="resetBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M21 21v-5h-5"/></svg> Reset</button>
            </div>
        </div>
    </div>

    <div class="meal-app-container">

        <div class="day-panel">
            <div class="day-nav">
                <button type="button" class="day-nav-btn" onclick="shiftDay(-1)" title="Previous day">←</button>
                <div class="day-nav-center">
                    <div class="day-title" id="dayTitle">Today</div>
                    <div class="day-subtitle" id="daySubtitle"></div>
                    <button type="button" class="day-today-btn" onclick="jumpToday()">Jump to today</button>
                </div>
                <button type="button" class="day-nav-btn" onclick="shiftDay(1)" title="Next day">→</button>
            </div>
            <div class="day-grid" id="dayGrid"></div>
        </div>

        <div class="recipe-panel">
            <div class="panel-header">
                <div>
                    <div class="panel-label">Recipes</div>
                    <h2>Pick & drag into a meal</h2>
                </div>
                <div class="panel-header-actions">
                    <button class="ghost-btn" id="findByIngredientsBtn" title="Find recipes from ingredients you have">🥑 What can I make?</button>
                    <button class="primary-btn" id="addRecipeBtn">+ Add recipe</button>
                </div>
            </div>
            <div class="filter-chips" id="filterChips"></div>
            <div class="recipe-list" id="recipeList"></div>
        </div>
    </div>
    <div class="confetti-layer" id="confettiLayer"></div>

    <div class="modal hidden" id="ingredientModal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="ingredientModalTitle">
            <button class="modal-close" id="closeIngredientBtn" aria-label="Close">×</button>
            <h3 id="ingredientModalTitle">🥑 What can I make?</h3>
            <p class="modal-intro">Type ingredients you have at home (one per line or comma-separated) and we'll find recipes that use them.</p>
            <div class="modal-body">
                <label class="input-group full-width">
                    <span>Ingredients</span>
                    <textarea id="ingredientInput" rows="3" placeholder="avocado, chicken, rice"></textarea>
                </label>
                <div class="ingredient-quick">
                    <span class="ingredient-quick-label">Quick add:</span>
                    <button type="button" class="ingredient-chip" data-ing="chicken">🍗 chicken</button>
                    <button type="button" class="ingredient-chip" data-ing="beef">🥩 beef</button>
                    <button type="button" class="ingredient-chip" data-ing="avocado">🥑 avocado</button>
                    <button type="button" class="ingredient-chip" data-ing="cheese">🧀 cheese</button>
                    <button type="button" class="ingredient-chip" data-ing="egg">🥚 egg</button>
                    <button type="button" class="ingredient-chip" data-ing="rice">🍚 rice</button>
                    <button type="button" class="ingredient-chip" data-ing="pasta">🍝 pasta</button>
                    <button type="button" class="ingredient-chip" data-ing="banana">🍌 banana</button>
                    <button type="button" class="ingredient-chip" data-ing="tomato">🍅 tomato</button>
                    <button type="button" class="ingredient-chip" data-ing="potato">🥔 potato</button>
                    <button type="button" class="ingredient-chip" data-ing="broccoli">🥦 broccoli</button>
                    <button type="button" class="ingredient-chip" data-ing="salmon">🐟 salmon</button>
                </div>
                <button type="button" class="primary-btn" id="searchIngredientsBtn">🔎 Find recipes</button>
                <div class="ingredient-status" id="ingredientStatus"></div>
                <div class="ingredient-results" id="ingredientResults"></div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="recipeModal" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" id="closeModalBtn" aria-label="Close">×</button>
            <h3 id="modalTitle">Add a recipe</h3>
            <div class="modal-body">
                <div class="url-fetcher">
                    <label class="input-group full-width">
                        <span>Paste a recipe URL</span>
                        <div class="url-row">
                            <input type="url" id="newRecipeUrl" placeholder="https://www.themealdb.com/meal/52854 or any recipe link">
                            <button type="button" class="primary-btn" id="fetchUrlBtn">Fetch</button>
                        </div>
                    </label>
                    <div class="fetch-status" id="fetchStatus"></div>
                    <div class="preview-block hidden" id="previewBlock">
                        <img id="previewImg" alt="Preview"/>
                        <div class="preview-text">
                            <div class="preview-name" id="previewName"></div>
                            <div class="preview-summary" id="previewSummary"></div>
                        </div>
                    </div>
                </div>
                <label class="input-group">
                    <span>Recipe name</span>
                    <input type="text" id="newRecipeName" placeholder="e.g. Berry Smoothie">
                </label>
                <label class="input-group">
                    <span>Best for</span>
                    <select id="newRecipeMeal">
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Snack">Snack</option>
                    </select>
                </label>
                <label class="input-group">
                    <span>Emoji (fallback)</span>
                    <input type="text" id="newRecipeEmoji" placeholder="🍽️" maxlength="6">
                </label>
                <label class="input-group full-width">
                    <span>Image URL (optional)</span>
                    <input type="url" id="newRecipeImage" placeholder="https://…/photo.jpg">
                </label>
                <label class="input-group full-width">
                    <span>Short description</span>
                    <input type="text" id="newRecipeSummary" placeholder="What's it like?">
                </label>
                <div class="input-group full-width">
                    <span>Food groups</span>
                    <div class="nutrition-grid">
                        <label><input type="checkbox" id="grp_Fruits"> 🍎 Fruits</label>
                        <label><input type="checkbox" id="grp_Veggies"> 🥦 Veggies</label>
                        <label><input type="checkbox" id="grp_Protein"> 💪 Protein</label>
                        <label><input type="checkbox" id="grp_Grains"> 🌾 Grains</label>
                        <label><input type="checkbox" id="grp_Dairy"> 🥛 Dairy</label>
                    </div>
                </div>
                <div class="input-group full-width">
                    <span>Nutrition (grams)</span>
                    <div class="macro-inputs">
                        <input type="number" id="newCarbs" placeholder="Carbs ⚡" min="0" value="30">
                        <input type="number" id="newProtein" placeholder="Protein 💪" min="0" value="10">
                        <input type="number" id="newFat" placeholder="Fat 🧠" min="0" value="8">
                        <input type="number" id="newSugar" placeholder="Sugar 🍬" min="0" value="5">
                        <input type="number" id="newFiber" placeholder="Fiber 🌿" min="0" value="2">
                        <input type="number" id="newSodium" placeholder="Sodium mg 🧂" min="0" value="200">
                    </div>
                </div>
            </div>
            <button class="primary-btn modal-save" id="saveRecipeBtn">Save recipe</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="profile.js?v=1"></script>
    <script src="meal-planner.js?v=17"></script>
</body>
</html>
